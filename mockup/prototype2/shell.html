<title>V4 Clinic Workspace</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a clinical web application. Fixed app bar, a narrow navigation rail, and a work area
   that holds either a list page or a measurement workspace with its own tab bar and side panels.
   Device figures (maps, curves) always draw on a light "paper" surface with the fixed z scale. */
/* Company design continuity: the company's navy and lime (web site and company report templates), lifted to a
   modern product: navy carries the chrome and primary actions, lime marks brand and selection,
   pale lime is the soft highlight. Semantic colours stay separate from the brand lime. */
:root {
  --bg: #f1f5fa; --surface: #ffffff; --surface-2: #f6f9fc; --band: #e3eef8; --ink: #1d2738; --ink-2: #3d4a5c; --muted: #6a7688;
  --line: #dfe4eb; --line-2: #cbd3dd; --accent: #354b6a; --accent-2: #273a55; --accent-ink: #ffffff; --accent-soft: #e8edf4;
  --brand: #96c11f; --brand-2: #7fa616; --brand-soft: #f0f8dc; --brand-ink: #4b6a00;
  --ok: #1f7a55; --ok-soft: #e1f2ea; --warn: #a3184f; --warn-soft: #fae6ee; --amber: #8f5b00; --amber-soft: #fcf0d6;
  --info: #0b6b6f; --info-soft: #dcf0ef;
  --device: #e8edf4; --device-ink: #2a3d57; --clinic: #fbeee4; --clinic-ink: #8a3d12; --clinician: #f0f8dc; --clinician-ink: #4b6a00;
  --paper: #ffffff; --paper-ink: #1f1f1e; --paper-line: #e3e2de;
  --nav-bg: #2a2e47; --nav-ink: #c3c9dc; --nav-on: #ffffff; --nav-hi: #363b5a;
  --shadow: 0 1px 2px rgba(30,40,70,0.06), 0 2px 10px rgba(30,40,70,0.06);
  --f-ui: 'Nunito Sans', 'Segoe UI', system-ui, sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
  --r: 8px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11151f; --surface: #181e2b; --surface-2: #1d2433; --band: #1a2536; --ink: #e4e9f1; --ink-2: #c3ccd9; --muted: #8f9aac;
  --line: #29313f; --line-2: #36404f; --accent: #8fb0d8; --accent-2: #a9c3e3; --accent-ink: #0e1420; --accent-soft: #1f2a3d;
  --brand: #a8d43a; --brand-2: #bde15c; --brand-soft: #253017; --brand-ink: #c6e57a;
  --ok: #6fd2a2; --ok-soft: #15352a; --warn: #ff8fb8; --warn-soft: #3a1727; --amber: #f2c46e; --amber-soft: #362a12;
  --info: #63d0c8; --info-soft: #12302f;
  --device: #1f2a3d; --device-ink: #a9c3e3; --clinic: #3a271b; --clinic-ink: #f0b48a; --clinician: #253017; --clinician-ink: #c6e57a;
  --paper: #fbfbfa; --paper-ink: #1f1f1e; --paper-line: #e3e2de;
  --nav-bg: #0d111a; --nav-ink: #a3acc0; --nav-on: #ffffff; --nav-hi: #1c2232; --shadow: 0 1px 2px rgba(0,0,0,0.4); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #11151f; --surface: #181e2b; --surface-2: #1d2433; --band: #1a2536; --ink: #e4e9f1; --ink-2: #c3ccd9; --muted: #8f9aac;
  --line: #29313f; --line-2: #36404f; --accent: #8fb0d8; --accent-2: #a9c3e3; --accent-ink: #0e1420; --accent-soft: #1f2a3d;
  --brand: #a8d43a; --brand-2: #bde15c; --brand-soft: #253017; --brand-ink: #c6e57a;
  --ok: #6fd2a2; --ok-soft: #15352a; --warn: #ff8fb8; --warn-soft: #3a1727; --amber: #f2c46e; --amber-soft: #362a12;
  --info: #63d0c8; --info-soft: #12302f;
  --device: #1f2a3d; --device-ink: #a9c3e3; --clinic: #3a271b; --clinic-ink: #f0b48a; --clinician: #253017; --clinician-ink: #c6e57a;
  --paper: #fbfbfa; --paper-ink: #1f1f1e; --paper-line: #e3e2de;
  --nav-bg: #0d111a; --nav-ink: #a3acc0; --nav-on: #ffffff; --nav-hi: #1c2232; --shadow: 0 1px 2px rgba(0,0,0,0.4); color-scheme: dark }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--f-ui); }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; font-weight: 700; color: var(--ink); }
h1 { font-size: 20px; } h2 { font-size: 16px; } h3 { font-size: 14px; } h4 { font-size: 13px; }
.mono, .num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); } .small { font-size: 12.5px; } .xs { font-size: 11.5px; }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---- app chrome ---- */
.appbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; height: 52px; background: var(--surface); border-bottom: 1px solid var(--line); box-shadow: inset 0 -3px 0 var(--brand);
  display: flex; align-items: center; gap: 14px; padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
.logo { display: flex; align-items: center; gap: 8px; font-weight: 700; letter-spacing: 0.01em; text-decoration: none; color: var(--ink); }
.logo .wm { display: grid; line-height: 1; } .logo .wm b { font-size: 18px; font-weight: 800; color: var(--accent); letter-spacing: 0.01em; } .logo .wm small { font-size: 11px; font-weight: 700; color: var(--brand-2); letter-spacing: 0.08em; text-transform: uppercase; margin-top: 2px; }
.logo i { width: 30px; height: 30px; border-radius: 8px; background: var(--nav-bg); color: var(--brand); font-weight: 700; display: grid; place-items: center; font-style: normal; font-size: 12px; font-family: var(--f-mono); }
.clinicpick { border: 1px solid var(--line); background: var(--surface-2); border-radius: 6px; padding: 5px 10px; font-size: 13px; }
.search { flex: 1; max-width: 440px; position: relative; }
.search input { width: 100%; border: 1px solid var(--line); background: var(--surface-2); border-radius: 6px; padding: 7px 10px 7px 30px; font-size: 13px; }
.search::before { content: "⌕"; position: absolute; left: 10px; top: 5px; color: var(--muted); font-size: 16px; }
.appbar .sp { flex: 1; }
.mock { background: var(--warn-soft); color: var(--warn); font-weight: 600; font-size: 11.5px; padding: 3px 8px; border-radius: 4px; letter-spacing: 0.02em; white-space: nowrap; }
.avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-weight: 600; font-size: 12px; }
.iconbtn { border: 0; background: none; width: 32px; height: 32px; border-radius: 6px; color: var(--ink-2); position: relative; }
.iconbtn:hover { background: var(--surface-2); }
.iconbtn .dot { position: absolute; top: 6px; right: 6px; width: 7px; height: 7px; border-radius: 50%; background: var(--warn); }
.frame { display: grid; grid-template-columns: 208px minmax(0, 1fr); min-height: calc(100% - 52px); }
.nav { background: var(--nav-bg); color: var(--nav-ink); padding: 12px 8px; padding-left: max(8px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 2px; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 6px; color: var(--nav-ink); text-decoration: none; font-size: 13.5px; }
.nav a:hover { background: var(--nav-hi); color: var(--nav-on); }
.nav a.on { background: var(--nav-hi); color: var(--nav-on); box-shadow: inset 3px 0 0 var(--brand); }
.nav a .ic { width: 18px; text-align: center; opacity: 0.85; }
.nav a .cnt { margin-left: auto; font-size: 11px; background: var(--brand); color: #1d2738; font-weight: 700; border-radius: 99px; padding: 0 7px; }
.nav .grp { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; opacity: 0.55; padding: 14px 10px 4px; }
.nav .foot { margin-top: auto; font-size: 11px; opacity: 0.6; padding: 10px; line-height: 1.5; }
main#main { min-width: 0; }
.page { padding-block: 20px 60px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); display: grid; gap: 16px; max-width: 1320px; }
.crumbs { font-size: 12.5px; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; }
.crumbs a { color: var(--muted); text-decoration: none; } .crumbs a:hover { color: var(--accent); }
.pagehead { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; }

/* ---- shared components (modules use these) ---- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); min-width: 0; }
.card > .hd { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.card > .bd { padding: 12px 14px; }
.btn { border: 1px solid var(--line-2); background: var(--surface); border-radius: 999px; padding: 6px 14px; font-size: 13px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; text-decoration: none; color: var(--ink); }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { background: var(--accent-2); }
.btn.ghost { border-color: transparent; background: none; }
.btn.danger { color: var(--warn); border-color: var(--warn); }
.btn.sm { padding: 3px 8px; font-size: 12px; }
.btn[disabled], .btn.disabled { opacity: 0.45; cursor: not-allowed; }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 5px 10px; font-size: 12.5px; border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--accent); color: var(--accent-ink); }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 500; padding: 2px 8px; border-radius: 99px; background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); white-space: normal; overflow-wrap: break-word; max-width: 100%; line-height: 1.35; text-align: left; }
.tbl th .chip { white-space: nowrap; }
.chip.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.chip.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.chip.amber { background: var(--amber-soft); color: var(--amber); border-color: transparent; }
.chip.info { background: var(--info-soft); color: var(--info); border-color: transparent; }
.chip.device { background: var(--device); color: var(--device-ink); border-color: transparent; }
.chip.clinic { background: var(--clinic); color: var(--clinic-ink); border-color: transparent; }
.chip.clinician { background: var(--clinician); color: var(--clinician-ink); border-color: transparent; }
.chip .d { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }
.tbl { border-collapse: collapse; width: 100%; font-size: 13px; }
.tbl th { text-align: left; font-weight: 500; font-size: 11.5px; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--line); background: var(--surface-2); white-space: nowrap; }
.tbl td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl tr.link { cursor: pointer; } .tbl tr.link:hover td { background: var(--accent-soft); }
.tbl td.num, .tbl th.num { text-align: right; }
.up-sys td, .up-sys th { padding: 6px 8px; font-size: 12.5px; } .up-sys tr.on td { background: var(--accent-soft); }
.scroll-x { overflow-x: auto; }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--surface-2); }
.toolbar .sep { width: 1px; height: 22px; background: var(--line-2); }
.toolbar label { font-size: 12px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
.toolbar select, .field select, .field input, .field textarea { border: 1px solid var(--line-2); background: var(--surface); border-radius: 5px; padding: 4px 8px; font-size: 12.5px; }
.field { display: grid; gap: 4px; min-width: 0; } .field select, .field input { max-width: 100%; min-width: 0; } .field > span { font-size: 12px; color: var(--muted); }
.paper { background: var(--paper); color: var(--paper-ink); border: 1px solid var(--paper-line); border-radius: 6px; }
.banner { display: flex; gap: 10px; align-items: flex-start; padding: 9px 12px; border-radius: 0 6px 6px 0; font-size: 13px; background: var(--info-soft); color: var(--ink); border: 1px solid transparent; border-left: 4px solid var(--accent); }
.banner.amber { background: var(--amber-soft); border-left-color: var(--amber); } .banner.warn { background: var(--warn-soft); border-left-color: var(--warn); } .banner.ok { background: var(--brand-soft); border-left-color: var(--brand); }
.banner b { font-weight: 600; }
.sys { margin: 3px 0; } .sys .sid { font-family: var(--f-mono); font-size: 11px; color: var(--muted); margin-left: 6px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 5px 14px; font-size: 13px; } .kv dt { color: var(--muted); } .kv dd { margin: 0; }
.grid { display: grid; gap: 16px; } .g2 { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); } .g3 { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.between { justify-content: space-between; }
.empty { padding: 28px; text-align: center; color: var(--muted); }
/* spec annotations: off by default; the "Annotations" switch shows where a feature comes from */
.ann { display: none; font-family: var(--f-mono); font-size: 11px; font-weight: 400; color: var(--accent); background: var(--accent-soft); border: 1px dashed var(--accent); border-radius: 4px; padding: 0 5px; margin-left: 6px; vertical-align: 1px; white-space: normal; max-width: min(100%, 560px); overflow-wrap: anywhere; text-align: left; }
body.annotate .ann { display: inline-block; }

/* ---- measurement workspace ---- */
.ws-head { background: var(--surface); border-bottom: 1px solid var(--line); padding: 12px 20px 0; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); display: grid; gap: 10px; }
.ws-id { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; }
.ws-id .who { font-size: 18px; font-weight: 600; }
.ws-id .meta { color: var(--muted); font-size: 13px; display: flex; gap: 14px; flex-wrap: wrap; }
.pipe { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; font-size: 12px; }
.pipe span { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 99px; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.pipe span.done { color: var(--brand-ink); background: var(--brand-soft); border-color: transparent; }
.pipe span.now { color: var(--amber); background: var(--amber-soft); border-color: transparent; font-weight: 600; }
.pipe i { color: var(--line-2); font-style: normal; }
.pipe span.rej { color: var(--warn); background: var(--warn-soft); border-color: transparent; font-weight: 600; }
.ws-note { margin: 0; flex-wrap: wrap; } .ws-note > span { min-width: 200px; }
.wtabs { display: flex; gap: 2px; overflow-x: auto; }
.wtabs a { padding: 9px 14px; text-decoration: none; color: var(--muted); border-bottom: 2px solid transparent; font-weight: 500; white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; }
.wtabs a:hover { color: var(--ink); }
.wtabs a.on { color: var(--ink); border-color: var(--brand); }
.wtabs a .chip { font-size: 11px; padding: 0 6px; white-space: nowrap; }
.ws-body { padding-block: 16px 60px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); min-width: 0; }

/* ---- hero band: navy with a lime EEG trace, from the company's report cover ---- */
.hero { position: relative; overflow: hidden; background: var(--nav-bg); color: #ffffff; border-radius: 12px; padding: 22px 24px 62px; display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: flex-end; justify-content: space-between; }
.hero h1 { color: #ffffff; font-size: 24px; font-weight: 800; position: relative; }
.hero h1 span { display: block; color: var(--brand); font-weight: 700; font-size: 18px; margin-top: 2px; }
.hero .sub { color: #c3c9dc; font-size: 13px; position: relative; }
.hero svg.trace { position: absolute; left: 0; right: 0; bottom: 6px; width: 100%; height: 46px; opacity: 0.9; pointer-events: none; }
.hero .btn.primary { background: var(--brand); border-color: var(--brand); color: #1d2738; font-weight: 700; position: relative; }
.hero .btn.primary:hover { background: var(--brand-2); }
.twotone { font-weight: 800; } .twotone span { color: var(--brand-2); }
/* ---- support access: read only, free text hidden; the assistant view (open question) is read only
   on the measurement steps but sees the clinic's free text ---- */
body.ro.hidefree #modRoot textarea, body.ro.hidefree #modRoot [contenteditable] { filter: blur(4px); pointer-events: none; user-select: none; }
body.ro #modRoot textarea, body.ro #modRoot [contenteditable] { pointer-events: none; }
body.ro #modRoot input, body.ro #modRoot select { pointer-events: none; opacity: 0.6; }
/* ---- toast and dialog ---- */
#toasts { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: max(16px, env(safe-area-inset-bottom, 0px)); display: grid; gap: 8px; z-index: 50; }
.toast { background: var(--ink); color: var(--surface); padding: 9px 14px; border-radius: 6px; font-size: 13px; box-shadow: var(--shadow); max-width: 360px; }
.dlg-back { position: fixed; inset: 0; background: rgba(10,20,28,0.45); display: grid; place-items: center; z-index: 40; padding: 16px; }
.dlg { background: var(--surface); border-radius: 10px; width: min(520px, 100%); box-shadow: 0 10px 40px rgba(0,0,0,0.3); display: grid; }
.dlg .hd { padding: 14px 18px; border-bottom: 1px solid var(--line); } .dlg .bd { padding: 14px 18px; display: grid; gap: 10px; } .dlg .ft { padding: 12px 18px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 8px; }

@media (max-width: 900px) {
  .frame { grid-template-columns: minmax(0, 1fr); }
  .nav { flex-direction: row; flex-wrap: wrap; padding-right: max(8px, env(safe-area-inset-right, 0px)); }
  .nav .grp, .nav .foot { display: none; }
  .search, .clinicpick { display: none; }
}
@media (max-width: 520px) {
  .appbar { gap: 8px; }
  .appbar label[for="annToggle"], .logo .wm small { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
/* interface language switch (EN / DE) next to the mockup badge */
.langsw button { padding: 3px 7px; font-size: 11.5px; font-weight: 700; letter-spacing: 0.03em; }
/* role switcher (avatar menu): who is signed in, and "view as" for the demo */
.rolebtn { border: 0; padding: 0; background: none; border-radius: 50%; }
.rolebtn:hover .avatar { box-shadow: 0 0 0 2px var(--brand); }
.avatar.r-asst { background: var(--amber-soft); color: var(--amber); } .avatar.r-sup { background: var(--warn-soft); color: var(--warn); } .avatar.r-c2 { background: var(--clinician); color: var(--clinician-ink); }
.rolemenu { position: fixed; z-index: 45; top: 56px; right: max(10px, env(safe-area-inset-right, 0px)); width: min(340px, calc(100vw - 20px)); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.18); padding: 6px; display: grid; gap: 2px; }
.rolemenu .rm-hd { padding: 8px 10px 6px; font-size: 11.5px; color: var(--muted); }
.rolemenu button { border: 0; background: none; text-align: left; padding: 8px 10px; border-radius: 6px; display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 2px 10px; align-items: center; }
.rolemenu button:hover, .rolemenu button.on { background: var(--accent-soft); }
.rolemenu button .avatar { grid-row: span 2; width: 28px; height: 28px; font-size: 11px; }
.rolemenu button b { font-weight: 600; font-size: 13px; } .rolemenu button span.xs { color: var(--muted); }
.rolemenu .rm-ft { border-top: 1px solid var(--line); margin-top: 4px; padding: 8px 10px 4px; font-size: 11.5px; }
/* sub navigation above a page (Report templates | V3 template mapping) */
.subtabs { display: flex; gap: 2px; overflow-x: auto; border-bottom: 1px solid var(--line); background: var(--surface); padding: 0 20px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
.subtabs a { padding: 10px 14px; text-decoration: none; color: var(--muted); border-bottom: 2px solid transparent; font-weight: 600; font-size: 13px; white-space: nowrap; }
.subtabs a:hover { color: var(--ink); } .subtabs a.on { color: var(--ink); border-color: var(--brand); }
/* first day of a new clinic */
.firststeps { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.firststeps li { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.firststeps li:last-child { border-bottom: 0; }

<script>
/* =========================================================================================
   Shell: data, state, shared helpers (APP), interface language (APP.i18n, APP.t), router,
   list pages. Modules register in window.Modules and render the measurement workspace tabs.
   ========================================================================================= */
const DATA = /*__DATA__*/null;
window.Modules = window.Modules || {};
let LANG = 'en'; /* English is the default; a viewer's choice is remembered in this browser only */
try { const l = localStorage.getItem('v4-ui-lang'); if (l === 'en' || l === 'de') LANG = l; } catch (e) {}
/* ---------------- cases ----------------
   Three synthetic people are modelled in full: MOCK-042 (data.case, measurements [M1, M2, M0]) and the
   extra cases MOCK-057 and MOCK-061 (data.extra_cases, one measurement each). APP.openCase(code) makes one
   of them current: APP.case, APP.m1 (null for a case with one measurement), APP.m2 (the current
   measurement), APP.sentences and APP.state all follow it. APP.state is kept per case; the keys in
   GLOBAL_KEYS (who is signed in, support view, list filters, the clinic template, the first-day demo)
   are shared by every case, so a module may read and write them through any case's APP.state. */
const G = { staffView: false, ui: { wl: 'mine' }, role: 'c1', empty: false, template: { version: 3 } };
const GLOBAL_KEYS = ['staffView', 'ui', 'role', 'empty', 'template'];
function newState() {
  const st = {
    segments: { confirmed: false, changes: 0 },
    cleaning: { confirmed: false, changed: [] },      /* [{ic, kind, removed}] filled by the cleaning module */
    markers: { confirmed: false, hz: null },
    report: { status: 'draft', version: 1, issued: [], texts: {} },
    rejected: null,   /* {why: i18n key, note, at: {d, tm}} while the recording is rejected */
    reopened: null,   /* {from, items, pk, at}: confirmations reopened by an upstream change */
    measurement: 'm2',
    /* an earlier recording uploaded later (B5, MOCK-042 M0): 'none' until the clinic adds it on the upload
       page, then 'queued', 'processing' (step 1 to 9) and 'done'; only then is M0 in APP.measurements() */
    earlier: { status: 'none', step: 0, at: null },
  };
  GLOBAL_KEYS.forEach(k => Object.defineProperty(st, k, { get: () => G[k], set: (v) => { G[k] = v; }, enumerable: true }));
  return st;
}
/* system sentences per language, same structure in each: APP.sentences.m2.summary follows the
   interface language; APP.sentences.de.m2.summary (or .en) names a language explicitly */
const CASES = {};
function addCase(c, sentences, rids) {
  const m2 = c.measurements[c.current_index ?? 1];
  const m1 = c.measurements.length > 1 && c.measurements[0] !== m2 ? c.measurements[0] : null;
  const sent = {}; Object.keys(sentences || {}).forEach(l => { sent[l] = Object.assign({}, sentences[l], sentences); });
  CASES[c.case_code] = { code: c.case_code, case: c, m1, m2, sent, rids: rids || {}, state: newState() };
}
addCase(DATA.case, DATA.sentences, DATA.report_ids);
Object.keys(DATA.extra_cases || {}).forEach(k => { const x = DATA.extra_cases[k]; addCase(x.case, x.sentences, x.report_ids); });
let CUR = CASES[DATA.case.case_code];
const APP = window.APP = {
  data: DATA,
  code: CUR.code,
  case: CUR.case,
  m1: CUR.m1,
  m2: CUR.m2,
  channels: CUR.case.channels,
  pos: CUR.case.positions,
  bands: CUR.case.bands,
  langs: ['en', 'de'],
  state: CUR.state,
  log: [],
  cases: Object.keys(CASES),   /* codes of the cases with full data */
  caseSeq: 0,                  /* raised on every case switch (modules may compare it to drop caches) */
};
Object.defineProperty(APP, 'lang', { get: () => LANG, enumerable: true });
Object.defineProperty(APP, 'sentences', { get: () => CUR.sent[LANG] || CUR.sent.en, enumerable: true });
Object.defineProperty(APP, 'role', { get: () => G.role, enumerable: true });
const caseHooks = [];
/* APP.onCase(fn): fn(code) runs after every case switch, before the page renders again */
APP.onCase = (fn) => { caseHooks.push(fn); };
/* APP.caseInfo(code) -> {code, case, m1, m2, sent, rids, state} of any modelled case, without switching */
APP.caseInfo = (code) => CASES[code || CUR.code] || null;
/* APP.openCase(code, route?): make a case current (false if it has no data); with route also navigate */
APP.openCase = (code, route) => {
  const c = CASES[code]; if (!c) return false;
  if (c !== CUR) {
    CUR = c; APP.code = c.code; APP.case = c.case; APP.m1 = c.m1; APP.m2 = c.m2; APP.state = c.state;
    APP.channels = c.case.channels; APP.pos = c.case.positions; APP.bands = c.case.bands; APP.caseSeq++;
    caseHooks.forEach(f => { try { f(code); } catch (e) { console.error(e); } });
  }
  if (route) APP.go(route);
  return true;
};
/* measurement key: 'm2' for the current measurement, else the last part of the id in lower case
   ('M-M1' -> 'm1', 'M-M0' -> 'm0'); pair keys of the comparison sentences are 'LATER|EARLIER' */
APP.mk = (m) => m === APP.m2 ? 'm2' : String(m.id).split('-').pop().toLowerCase();
APP.pairKey = (later, earlier) => `${APP.mk(later).toUpperCase()}|${APP.mk(earlier).toUpperCase()}`;
/* is a measurement available for viewing and comparison? An earlier recording uploaded later only once
   its reprocessing is done (APP.state.earlier.status) */
APP.available = (m, code) => { const c = CASES[code || CUR.code]; return !m.uploaded_later || c.state.earlier.status === 'done'; };
/* the available measurements of a case, oldest first (sorted by date, never by array index) */
APP.measurements = (code) => { const c = CASES[code || CUR.code]; return c.case.measurements.filter(m => APP.available(m, c.code)).slice().sort((a, b) => a.date < b.date ? -1 : 1); };
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = APP.esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* ---------------- interface language ----------------
   APP.i18n[lang][key] is a string with {param} slots, or a function (params, lang) for plurals and
   word order. APP.t(key, params, lang) falls back to English, then to the key itself. A param may be
   lazy: APP.tk(key, params) (translated when shown), {$d: iso} (a date) or {$n: number, d} (a
   number), so stored entries such as the activity log show in the language active when read. */
APP.i18n = { en: {}, de: {} };
/* a key added twice with different texts: the later text wins everywhere. APP.i18nClashes lists them
   (deliberate overrides inside one module show up too), so a clash between modules can be found */
APP.i18nClashes = [];
APP.addI18n = (dict) => { Object.keys(dict).forEach(l => { const D = APP.i18n[l] = APP.i18n[l] || {};
  Object.keys(dict[l]).forEach(k => { if (k in D && typeof D[k] === 'string' && D[k] !== dict[l][k]) APP.i18nClashes.push(l + ':' + k); D[k] = dict[l][k]; }); }); };
APP.tk = (key, p, extra) => Object.assign({ $k: key, p }, extra || {});
APP.pv = (v, L) => {
  if (v == null) return '';
  if (typeof v !== 'object') return String(v);
  if (v.$k) { const s = APP.t(v.$k, v.p, L); return v.lc ? APP.lc(s, L) : s; }
  if (v.$d) return APP.fmtDate(v.$d, L);
  if (v.$n != null) return APP.nf(v.$n, v.d ?? 1, L);
  if (Array.isArray(v)) return v.map(x => APP.pv(x, L)).join(', ');
  return String(v);
};
APP.t = (key, p, lang) => {
  const L = lang || LANG; let s = (APP.i18n[L] || {})[key];
  if (s == null) s = APP.i18n.en[key];
  if (s == null) return String(key);
  if (typeof s === 'function') return s(p || {}, L);
  return p ? s.replace(/\{(\w+)\}/g, (m, k) => (k in p ? APP.pv(p[k], L) : m)) : s;
};
APP.setLang = (l) => { if (!APP.langs.includes(l) || l === LANG) return; LANG = l; try { localStorage.setItem('v4-ui-lang', l); } catch (e) {} render(); };
/* lower-case the first letter where English needs it mid-sentence; German nouns keep their capital */
APP.lc = (s, L) => (L || LANG) === 'de' ? String(s) : String(s).charAt(0).toLowerCase() + String(s).slice(1);
/* numbers in visible text: German decimal comma; the data stay unchanged */
APP.nf = (v, d = 1, L) => { if (v == null || isNaN(v)) return ''; const s = (+v).toFixed(d); return (L || LANG) === 'de' ? s.replace('.', ',') : s; };
APP.nx = (v, L) => (L || LANG) === 'de' ? String(v).replace(/(\d)\.(\d)/g, '$1,$2') : String(v);
APP.pct = (v, d = 0, L) => APP.nf(v, d, L) + ((L || LANG) === 'de' ? ' %' : '%');
APP.int = (n, L) => (+n).toLocaleString((L || LANG) === 'de' ? 'de-DE' : 'en-GB');
const MON = { en: ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],
  enL: ['January','February','March','April','May','June','July','August','September','October','November','December'],
  deL: ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'] };
const DAY = { en: ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'], de: ['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'] };
const p2 = (n) => String(n).padStart(2, '0');
const dt = (iso) => new Date(iso + 'T12:00:00');
APP.fmtDate = (iso, L) => { const d = dt(iso); return (L || LANG) === 'de' ? `${p2(d.getDate())}.${p2(d.getMonth() + 1)}.${d.getFullYear()}` : `${d.getDate()} ${MON.en[d.getMonth()]} ${d.getFullYear()}`; };
APP.fmtShort = (iso, L) => { const d = dt(iso); return (L || LANG) === 'de' ? `${p2(d.getDate())}.${p2(d.getMonth() + 1)}.` : `${d.getDate()} ${MON.en[d.getMonth()]}`; };
APP.fmtLong = (iso, L) => { const d = dt(iso); return (L || LANG) === 'de' ? `${DAY.de[d.getDay()]}, ${d.getDate()}. ${MON.deL[d.getMonth()]} ${d.getFullYear()}` : `${DAY.en[d.getDay()]}, ${d.getDate()} ${MON.enL[d.getMonth()]} ${d.getFullYear()}`; };
/* a stored moment {d: iso, tm: 'HH:MM'} */
APP.at = (x, L) => x && typeof x === 'object' ? `${APP.fmtDate(x.d, L)}, ${x.tm}` : String(x ?? '');
APP.now = () => ({ d: '2026-10-29', tm: APP.time() });
/* data values that carry English words (names of norms and systems): shown translated, stored unchanged */
const DV = { de: { 'Mock norms 2026.1 (synthetic)': 'Mock norms 2026.1 (synthetisch)', 'Mitsar amplifier, WinEEG file (mockup label)': 'Mitsar-Verstärker, WinEEG-Datei (Mockup-Bezeichnung)' } };
APP.dv = (s, L) => (DV[L || LANG] || {})[s] || s;

APP.ann = (t) => `<span class="ann">${esc(t)}</span>`;
APP.sys = (items) => { if (typeof items === 'string') items = items.split('.').reduce((o, k) => (o || {})[k], APP.sentences);
  return (items || []).map(s => `<p class="sys">${esc(s.text)}<span class="sid">${esc(s.id)}</span></p>`).join(''); };
APP.time = () => new Date().toTimeString().slice(0, 5);
/* activity log: actor and text are i18n keys with params, rendered in the language active when read */
/* the signed-in role (role switcher) replaces Clinician 1 as the actor: support staff, Clinician 2, the assistant */
APP.addLog = (actor, key, params) => { if (actor === 'who.c1') actor = G.staffView ? 'who.support' : ({ c2: 'who.c2', asst: 'who.asst' }[G.role] || actor);
  APP.log.unshift({ tm: APP.time(), actor, key, p: params, code: params && 'code' in params ? params.code : (NONCASE.has(key) ? '' : APP.code) }); };
/* log entries that belong to the clinic, not to a case (the Case column stays empty) */
const NONCASE = new Set(['log.grant', 'log.support', 'log.leftSupport', 'log.empty0', 'd.log.inv']);
APP.logText = (e, L) => APP.t(e.key, e.p, L);
APP.toast = (text) => { const t = document.createElement('div'); t.className = 'toast'; t.textContent = text; $('#toasts').append(t); setTimeout(() => t.remove(), 3200); };
APP.css = (id, css) => { if (document.getElementById('css-' + id)) return; const s = document.createElement('style'); s.id = 'css-' + id; s.textContent = css; document.head.append(s); };
APP.go = (route) => { if (location.hash.slice(1) === route) render(); else location.hash = route; };
APP.refresh = () => render();
APP.dialog = ({ title, body, ok, cancel, onOk }) => {
  ok = ok ?? APP.t('ok'); cancel = cancel ?? APP.t('cancel');
  const back = document.createElement('div'); back.className = 'dlg-back';
  back.innerHTML = `<div class="dlg" role="dialog" aria-modal="true"><div class="hd"><h2>${esc(title)}</h2></div><div class="bd">${body}</div><div class="ft"><button class="btn" data-x>${esc(cancel)}</button><button class="btn primary" data-ok>${esc(ok)}</button></div></div>`;
  document.body.append(back);
  const close = () => back.remove();
  back.querySelector('[data-x]').onclick = close;
  back.querySelector('[data-ok]').onclick = () => { if (!onOk || onOk(back) !== false) close(); };
  back.addEventListener('click', e => { if (e.target === back) close(); });
  const esc_ = e => { if (e.key === 'Escape') close(); }; document.addEventListener('keydown', esc_);
  window.addEventListener('hashchange', close, { once: true });
  return back;
};
APP.css_var = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

/* shell strings; modules add their own with APP.addI18n */
APP.addI18n({

  const tabChip = { segments: s.segments.confirmed ? '' : chip('amber', 'chip.review'), cleaning: rej ? chip('warn', 'chip.rej') : s.cleaning.confirmed ? '' : (s.segments.confirmed ? chip('amber', 'chip.review') : ''), report: rej || s.report.status === 'issued' ? '' : (s.cleaning.confirmed ? chip('info', 'chip.draft') : '') };
  const open = reopenedOpen();
  const notes = (rej ? `<div class="banner warn ws-note"><b>${esc(T('rej.title'))}</b><span style="flex:1">${esc(T('rej.text', { why: T(rej.why) + (rej.note ? ' (' + rej.note + ')' : ''), at: APP.at(rej.at) }))}</span><button class="btn sm" id="wsUnrej">${esc(T('rej.undo'))}</button></div>` : '')
    + (open.length ? `<div class="banner amber ws-note"><b>${esc(T('rop.title'))}</b><span style="flex:1">${esc(T('rop.text', { from: T('rop.from.' + s.reopened.from), list: open.map(k => T('rop.item.' + k)).join(', ') }))}</span>${APP.ann('3.4 Clinician in control, Working; mockup assumption: a change upstream reopens the later confirmations')}</div>` : '');
  const rec = T('ws.recL', { sys: sysShort(m2), eo: q.EO ? q.EO.recorded_s : 0, ec: q.EC ? q.EC.recorded_s : 0, v: q.VCPT ? Math.round(q.VCPT.recorded_s / 60) : 0 });
  return `<div class="ws-head">
    <div class="crumbs"><a href="#patients">${esc(T('pat.title'))}</a><span>/</span><a href="#patient">${esc(APP.name())}</a><span>/</span><span>${esc(T('ws.crumb', { d: APP.fmtDate(m2.date) }))}</span></div>
    <div class="ws-id"><span class="who">${esc(APP.name())}</span><span class="meta"><span class="mono">${CUR.code}</span><span>${esc(T('ws.meta', { age: Math.floor(m2.age_years), sex: T('sex.' + sexKey(APP.case.sex)) }))}</span><span>${esc(T('ws.recorded', { d: APP.fmtDate(m2.date) }))}</span><span>${esc(rec)}</span>${flagChips(CUR.code)}</span>
      <span class="pipe">${order.map((o, i) => `<span class="${i < idx || (o === 'issued' && st === 'issued') ? 'done' : (i === idx && !rej ? 'now' : '')}">${i < idx || (o === 'issued' && st === 'issued') ? '✓' : ''} ${esc(T('pipe.' + o))}</span>`).join('<i>›</i>')}${rej ? `<i>·</i><span class="rej">✕ ${esc(T('pipe.rejected'))}</span>` : ''}</span></div>
    ${notes}<nav class="wtabs">${WS_TABS.map(k => `<a href="#${k}" class="${tab === k ? 'on' : ''}">${esc(T('ws.' + k))} ${tabChip[k] || ''}</a>`).join('')}</nav>
  </div><div class="ws-body" id="modRoot"></div>`;
}
PAGES.overview = null; /* rendered by the shell into the workspace */
function overview(root) {
  const s = APP.state, m2 = APP.m2, q = m2.quality, st = stage(), pw = m2.processed_with || {}, miss = m2.results_missing || {};
  /* issuing also needs the marker and the scored ERP peaks (confirmed on the Results tab) */
  const resOpen = !s.markers.confirmed || [...new Set(m2.erp.peaks.filter(p => p.latency_ms != null).map(p => p.condition))].some(t => !((s.peaks || {})[t] || {}).confirmed);
  const next = { segments: ['ov.seg', 'segments'], cleaning: ['ov.cln', 'cleaning'], report: resOpen ? ['ov.res', 'results'] : ['ov.rep', 'report'], issued: ['ov.iss', 'issued'], rejected: ['ov.rej', 'cleaning'] }[st];
  const qChip = Object.keys(miss).length ? Object.keys(miss).map(k => `<span class="chip amber">${esc(T('fl.min', { cond: T('cond.' + k) }))}</span>`).join(' ') : `<span class="chip ok">${esc(T('ov.qok'))}</span>`;
  const rc = APP.rcRows(m2), F = DATA.recording_condition_fields;
  const sha = pw.input_sha256 || '';
  root.innerHTML = `<div class="grid" style="max-width:1200px">
    <div class="banner ${st === 'issued' ? 'ok' : st === 'rejected' ? 'warn' : 'amber'}"><b>${esc(T('ov.next'))}</b><span style="flex:1">${esc(T(next[0]))}.</span><a class="btn sm primary" href="#${next[1]}">${esc(T('open'))}</a></div>
    ${m2.no_norm ? `<div class="banner warn"><b>${esc(T('st.nonorm'))}</b><span style="flex:1">${esc(T('ov.nonorm', { age: APP.nf(m2.no_norm.age_years, 1), lo: m2.no_norm.norm_age_range_years[0], hi: m2.no_norm.norm_age_range_years[1] }))}</span>${APP.ann('Intended use section 5: no comparison outside the norm age range (M58)')}</div>` : ''}
    <div class="grid g2">
      <div class="card"><div class="hd"><h2>${esc(T('ov.recording'))}</h2><span class="row">${qChip}</span></div><div class="bd">
        <div class="scroll-x"><table class="tbl"><tr><th>${T('th.condition')}</th><th class="num">${T('th.recorded')}</th><th class="num">${T('th.analysed')}</th></tr>
        ${Object.entries(q.recordings).map(([k, v]) => `<tr><td>${T('cond.' + k)}${miss[k] ? `<div class="xs" style="color:var(--amber)">${esc(T('ov.minRow', { min: miss[k].minimum_s }))}</div>` : ''}</td><td class="num">${v.recorded_s} s</td><td class="num">${v.analysed_s} s</td></tr>`).join('')}</table></div>
        <p class="small muted" style="margin-bottom:0">${esc(T('ov.trials', q.accepted_trials))}</p></div></div>
      <div class="card"><div class="hd"><h2>${esc(T('ov.proc'))}</h2>${APP.ann('3.8 Speed, Reproducibility; D6: input checksum, ICA seed, UDI placeholder')}</div><div class="bd"><dl class="kv">
        <dt>${T('kv.software')}</dt><dd>${esc(pw.software)}</dd><dt>${T('kv.norms')}</dt><dd>${esc(APP.dv(pw.norms))}</dd>
        <dt>${T('kv.pipeline')}</dt><dd>${esc(pw.pipeline || '')}</dd><dt>${T('kv.procAt')}</dt><dd>${esc(APP.fmtAt(pw.processed_at))} · ${esc(APP.fmtDur(pw.processing_s || 400))}</dd>
        <dt>${T('kv.ref')}</dt><dd>${esc(T('kv.refV'))}</dd><dt>${T('kv.segments')}</dt><dd>${esc(T(s.segments.confirmed ? 'ov.confBy' : 'ov.proposed'))}</dd>
        <dt>${T('kv.cleaning')}</dt><dd>${esc(T(s.cleaning.confirmed ? (s.cleaning.changed.length ? 'ov.changed' : 'ov.asProp') : 'ov.proposed'))}</dd>
        <dt>${T('kv.input')}</dt><dd><span class="reprorow" title="${esc(sha)}">${esc(sha.slice(0, 16))}…</span> <span class="xs muted">(${esc(T('kv.inputL'))})</span></dd>
        <dt>${T('kv.seed')}</dt><dd class="mono">${esc(pw.ica_seed ?? '')}</dd><dt>${T('kv.udi')}</dt><dd class="small">${esc(T('kv.udiV'))}</dd></dl></div></div>
    </div>
    <div class="grid g2">
      <div class="card"><div class="hd"><h2>${esc(F ? (F.title[LANG] || F.title.en) : T('ov.rcT'))}</h2>${APP.ann('D5, intended use section 5: recording conditions documented by the user (M60)')}</div><div class="bd"><dl class="kv">${rc.map(([l, v]) => `<dt>${esc(l)}</dt><dd>${esc(v)}</dd>`).join('')}</dl></div></div>
      <div class="card"><div class="hd"><h2>${esc(T('ov.summary'))}</h2><a class="small" href="#results">${esc(T('ov.openRes'))}</a></div><div class="bd">${APP.sys(APP.sentences.m2.summary)}</div></div>
    </div>
  </div>`;
}

/* ---------------- roles (D3): who is signed in; the demo switches between them ---------------- */
/* clinic side one role, clinician, with the clinic administrator permission for the first clinician
   (N10); the assistant role is open (not in the core); company support only with the clinic's grant */
const ROLES = ['c1', 'c2', 'asst', 'support'];
const PERMS = { c1: ['upload', 'conditions', 'names', 'freetext', 'review', 'issue', 'admin', 'grant'], c2: ['upload', 'conditions', 'names', 'freetext', 'review', 'issue'], asst: ['upload', 'conditions', 'names'], support: [] };
APP.roles = ROLES;
/* APP.can(perm): perm one of upload, conditions, names, freetext, review, issue, admin, grant */
APP.can = (perm) => (PERMS[G.role] || []).includes(perm);
APP.setRole = (r) => { if (!ROLES.includes(r) || r === G.role) return; const was = G.role;
  if (was === 'support') APP.addLog('who.support', 'log.leftSupport');
  G.role = r; G.staffView = r === 'support';
  if (r === 'support') APP.addLog('who.support', 'log.support');
  render(); };
const AV = { c1: ['C1', ''], c2: ['C2', 'r-c2'], asst: ['AS', 'r-asst'], support: ['CS', 'r-sup'] };
function roleUI() { const [t, c] = AV[G.role] || AV.c1, a = $('#avatar'); if (!a) return; a.textContent = t; a.className = 'avatar ' + c; $('#roleBtn').title = T('rn.' + G.role) + ' · ' + T('rd.' + G.role); }
function roleMenu() {
  const old = $('.rolemenu'); if (old) { old.remove(); $('#roleBtn').setAttribute('aria-expanded', 'false'); return; }
  const m = document.createElement('div'); m.className = 'rolemenu'; m.setAttribute('role', 'menu');
  m.innerHTML = `<div class="rm-hd">${esc(T('rm.hd'))} ${APP.ann('3.6 Who sees what; N10 roles; the switch is a demo control')}</div>` + ROLES.map(r => `<button role="menuitemradio" aria-checked="${G.role === r}" data-role="${r}" class="${G.role === r ? 'on' : ''}"><span class="avatar ${AV[r][1]}">${AV[r][0]}</span><b>${esc(T('rn.' + r))}</b><span class="xs">${esc(T('rd.' + r))}</span></button>`).join('')
    + `<div class="rm-ft"><a href="#settings" data-rmx>${esc(T('rm.ft'))}</a></div>`;
  document.body.append(m); $('#roleBtn').setAttribute('aria-expanded', 'true');
  const close = () => { m.remove(); $('#roleBtn').setAttribute('aria-expanded', 'false'); document.removeEventListener('click', out, true); };
  const out = (e) => { if (!m.contains(e.target) && !e.target.closest('#roleBtn')) close(); };
  setTimeout(() => document.addEventListener('click', out, true), 0);
  m.addEventListener('keydown', e => { if (e.key === 'Escape') { close(); $('#roleBtn').focus(); } });
  m.querySelectorAll('[data-role]').forEach(b => b.onclick = () => { close(); APP.setRole(b.dataset.role); });
  m.querySelector('[data-rmx]').onclick = () => close();
  const f = m.querySelector('button.on') || m.querySelector('button'); if (f) f.focus();
}
/* first day of a new clinic (D4, demo switch in Settings): a separate empty patient list and log */
APP.setEmpty = (on) => { on = !!on; if (on === G.empty) return;
  if (on) { G.fullLog = APP.log; APP.log = G.emptyLog || [{ tm: '08:00', at: { d: '2026-10-29', tm: '08:00' }, actor: 'who.system', key: 'log.empty0', code: '' }]; }
  else { G.emptyLog = APP.log; APP.log = G.fullLog || []; }
  G.empty = on; G.ui.anEdit = null; render(); };

/* ---------------- router ---------------- */
const WS = new Set(WS_TABS);
const MODPAGES = new Set(['settings', 'upload', 'mapping']);
let current = null;
function applyStatic() {
  document.documentElement.lang = LANG;
  $$('[data-i18n]').forEach(el => { el.textContent = T(el.dataset.i18n); });
  $$('[data-i18n-ph]').forEach(el => { el.placeholder = T(el.dataset.i18nPh); });
  $$('[data-i18n-al]').forEach(el => { el.setAttribute('aria-label', T(el.dataset.i18nAl)); });
  $$('[data-i18n-ti]').forEach(el => { el.title = T(el.dataset.i18nTi); });
  $$('#langSw button').forEach(b => { b.classList.toggle('on', b.dataset.uilang === LANG); b.setAttribute('aria-pressed', b.dataset.uilang === LANG); });
}
/* a deep link '#MOCK-057/overview' opens that case first (also used by the smoke test) */
function parseRoute() { const r = location.hash.slice(1) || 'worklist', mm = /^(MOCK-\d{3})(?:\/([\w-]+))?$/.exec(r);
  if (mm && CASES[mm[1]]) { APP.openCase(mm[1]); return mm[2] || 'patient'; } return r; }
function render() {
  const r = parseRoute();
  let route = (PAGES[r] !== undefined || WS.has(r) || r === 'templates' || MODPAGES.has(r)) ? r : 'worklist';
  if (G.empty && (WS.has(route) || route === 'patient' || route === 'compare')) route = 'patients';
  if (current && current.destroy) { try { current.destroy(); } catch (e) {} }
  current = null;
  applyStatic(); roleUI();
  const inCase = WS.has(route) || route === 'patient' || route === 'compare';
  $$('#nav a').forEach(a => a.classList.toggle('on', a.dataset.r === route || (a.dataset.r === 'patients' && inCase)));
  $('#cntWork').textContent = APP.patients().filter(p => p.group() === 'review' && p.by === mineKey()).length;
  const main = $('#main');
  const ro = (G.staffView || G.role === 'asst') && (WS.has(route) || route === 'templates');
  document.body.classList.toggle('ro', ro);
  document.body.classList.toggle('hidefree', ro && G.staffView);
  if (WS.has(route)) {
    main.innerHTML = workspace(route);
    if (G.staffView) { main.querySelector('.ws-head').insertAdjacentHTML('beforeend', `<div class="banner amber" style="margin-bottom:10px"><b>${esc(T('who.support'))}</b>${esc(T('ro.banner'))}</div>`); APP.addLog('who.support', 'log.openedSup', { r: route, code: CUR.code }); }
    else if (G.role === 'asst') main.querySelector('.ws-head').insertAdjacentHTML('beforeend', `<div class="banner amber" style="margin-bottom:10px"><b>${esc(T('who.asst'))}</b><span>${esc(T('ro.asst'))}</span>${APP.ann('Open question: an assistant role is not in the core and can be added later by configuration (N10); which tasks it may do is open')}</div>`);
    const root = $('#modRoot');
    if (route === 'overview') overview(root);
    else mount(route, root);
  } else if (route === 'templates' || route === 'mapping') {
    main.innerHTML = subtabs(route) + '<div class="page" id="modRoot"></div>'; mount(route === 'templates' ? 'template' : 'mapping', $('#modRoot'));
  } else if (MODPAGES.has(route)) {
    main.innerHTML = '<div class="page" id="modRoot"></div>'; mount(route, $('#modRoot'));
  } else {
    main.innerHTML = PAGES[route]();
    if (route === 'compare') mount('compare', $('#modRoot'));
  }
  wire(route);
}
function mount(name, root) {
  const M = window.Modules[name];
  if (!M) { root.innerHTML = `<div class="card"><div class="empty"><b>${esc(T('mod.none'))}</b><br>${esc(T('mod.next'))}</div></div>`; return; }
  try { current = M; M.render(root, { route: name }); }
  catch (e) { console.error(e); root.innerHTML = `<div class="banner warn"><b>${esc(T('mod.err'))}</b>${esc(e.message)}</div>`; }
}
function wire(route) {
  $$('#main [data-go]').forEach(el => el.onclick = () => { if (el.dataset.case) APP.openCase(el.dataset.case); APP.go(el.dataset.go); });
  const ur = $('#wsUnrej'); if (ur) ur.onclick = () => APP.undoReject();
  $$('#main [data-other]').forEach(el => el.onclick = () => APP.toast(T('toast.other', { code: el.dataset.other })));
  $$('#main [data-newp]').forEach(el => el.onclick = () => { G.ui.upPat = el.dataset.newp; G.ui.upMode = 'new'; APP.go('upload'); });
  $$('#main [data-newpat]').forEach(el => el.onclick = () => { if (APP.newPatient) APP.newPatient(); else APP.toast(T('mod.none')); });
  const ea = $('#main [data-earlier]'); if (ea) ea.onclick = () => { G.ui.upMode = 'earlier'; G.ui.upPat = CUR.code; };
  const un = $('#main [data-upnew]'); if (un) un.onclick = () => { G.ui.upMode = 'new'; G.ui.upPat = CUR.code; };
  $$('[data-wl]').forEach(b => b.onclick = () => { G.ui.wl = b.dataset.wl; render(); });
  const pq = $('#patQ');
  if (pq) { const f = () => { const q = pq.value.trim().toLowerCase(), st = $('#patSt').value, by = $('#patBy').value; let n = 0;
      $$('tr[data-q]').forEach(tr => { const show = (!q || tr.dataset.q.includes(q)) && (!st || tr.dataset.st === st) && (!by || tr.dataset.by === by); tr.hidden = !show; n += show; });
      $('#patCount').textContent = n; };
    pq.oninput = f; $('#patSt').onchange = f; $('#patBy').onchange = f; }
  const staff = $('#staff'); if (staff) staff.onchange = e => APP.setRole(e.target.checked ? 'support' : 'c1');
  /* anamnesis on the patient page */
  const ae = $('#anEdit'); if (ae) ae.onclick = () => { G.ui.anEdit = CUR.code; render(); const t = $('[data-anam]'); if (t) t.focus(); };
  const ac = $('#anCancel'); if (ac) ac.onclick = () => { G.ui.anEdit = null; render(); };
  const as = $('#anSave'); if (as) as.onclick = () => { const A = APP.case.identity_store.anamnesis = APP.case.identity_store.anamnesis || {}; let n = 0;
    $$('[data-anam]').forEach(t => { const k = t.dataset.anam, o = A[k] = A[k] || { en: '', de: '', ja: '' }; if ((o[LANG] ?? '') !== t.value) { o[LANG] = t.value; n++; } });
    G.ui.anEdit = null; if (n) { APP.addLog('who.c1', 'log.anam', { n }); APP.toast(T('toast.anam')); } render(); };
}
document.addEventListener('click', e => { const b = e.target.closest && e.target.closest('[data-uilang]'); if (b) APP.setLang(b.dataset.uilang);
  /* every way to "New measurement" starts a new recording; "Add earlier recording" sets its own mode */
  const u = e.target.closest && e.target.closest('a[href="#upload"]'); if (u && !u.hasAttribute('data-earlier')) G.ui.upMode = 'new'; });
$('#annToggle').onchange = e => document.body.classList.toggle('annotate', e.target.checked);
$('#bell').onclick = () => APP.toast(T(G.empty ? 'toast.bell0' : 'toast.bell'));
$('#roleBtn').onclick = () => roleMenu();
$('#gsearch').onkeydown = e => { if (e.key === 'Enter') { const v = e.target.value; APP.go('patients'); setTimeout(() => { const q = $('#patQ'); if (q) { q.value = v; q.oninput(); } }, 0); } };
window.addEventListener('hashchange', render);
/* support view and assistant view: block every action inside the work area, keep navigation */
document.addEventListener('click', e => {
  if (!document.body.classList.contains('ro')) return;
  const b = e.target.closest('#modRoot button, #modRoot [contenteditable], #modRoot canvas');
  if (!b || b.closest('.seg') || /^(Fit|75|100|Einpassen)/.test(b.textContent.trim())) return;
  e.preventDefault(); e.stopPropagation(); APP.toast(T(G.staffView ? 'ro.toast' : 'ro.asstToast'));
}, true);
/* the activity log as it stands on 29 October: three uploads and their processing */
[['MOCK-042', '2026-09-15', '10:39', '10:46', 400, true], ['MOCK-061', '2026-10-23', '09:52', '09:58', 395], ['MOCK-057', '2026-10-27', '11:13', '11:20', 412]].forEach(([code, d, tu, tp, sec, re]) => {
  if (!CASES[code]) return;
  APP.log.unshift({ tm: tu, at: { d, tm: tu }, actor: 'who.c1', key: 'log.upload', p: { d: { $d: d }, code }, code });
  APP.log.unshift({ tm: tp, at: { d, tm: tp }, actor: 'who.system', key: 'log.proc', p: { d: { $d: d }, code, dur: APP.tk('dur', { m: Math.floor(sec / 60), s: sec % 60 }) }, code });
  if (re && APP.m1) APP.log.unshift({ tm: '10:52', at: { d, tm: '10:52' }, actor: 'who.system', key: 'log.reproc', p: { d: { $d: APP.m1.date }, code }, code });
});
document.addEventListener('DOMContentLoaded', render);
/*__MODULES__*/
if (document.readyState !== 'loading') render();
</script>
