<style>
/* Layout: a clinical web application. Fixed app bar, a narrow navigation rail, and a work area
   that holds either a list page or a measurement workspace with its own tab bar and side panels.
   Device figures (maps, curves) always draw on a light "paper" surface with the fixed z scale. */
/* Heritage: the company's navy and lime (web site and company report templates), lifted to a
   modern product: navy carries the chrome and primary actions, lime marks brand and selection,
   pale lime is the soft highlight. Semantic colours stay separate from the brand lime. */
:root {
  --bg: #f1f5fa; --surface: #ffffff; --surface-2: #f6f9fc; --band: #e3eef8; --ink: #1d2738; --ink-2: #3d4a5c; --muted: #6a7688;
  --line: #dfe4eb; --line-2: #cbd3dd; --accent: #354b6a; --accent-2: #273a55; --accent-ink: #ffffff; --accent-soft: #e8edf4;
  --brand: #96c11f; --brand-2: #7fa616; --brand-soft: #f0f8dc; --brand-ink: #4b6a00;
  --ok: #1f7a55; --ok-soft: #e1f2ea; --warn: #b3261e; --warn-soft: #fbe8e6; --amber: #8f5b00; --amber-soft: #fcf0d6;
  --info: #2f5f9e; --info-soft: #e6eef8;
  --device: #e8edf4; --device-ink: #2a3d57; --clinic: #fbeee4; --clinic-ink: #8a3d12; --clinician: #f0f8dc; --clinician-ink: #4b6a00;
  --paper: #ffffff; --paper-ink: #1f1f1e; --paper-line: #e3e2de;
  --nav-bg: #2a2e47; --nav-ink: #c3c9dc; --nav-on: #ffffff; --nav-hi: #363b5a;
  --shadow: 0 1px 2px rgba(30,40,70,0.06), 0 2px 10px rgba(30,40,70,0.06);
  --f-ui: 'Nunito Sans', 'Segoe UI', system-ui, sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
  --r: 8px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11151f; --surface: #181e2b; --surface-2: #1d2433; --band: #1a2536; --ink: #e4e9f1; --ink-2: #c3ccd9; --muted: #8f9aac;
  --line: #29313f; --line-2: #36404f; --accent: #8fb0d8; --accent-2: #a9c3e3; --accent-ink: #0e1420; --accent-soft: #1f2a3d;
  --brand: #a8d43a; --brand-2: #bde15c; --brand-soft: #253017; --brand-ink: #c6e57a;
  --ok: #6fd2a2; --ok-soft: #15352a; --warn: #ff8a7e; --warn-soft: #3a1b18; --amber: #f2c46e; --amber-soft: #362a12;
  --info: #8ab4f8; --info-soft: #182a46;
  --device: #1f2a3d; --device-ink: #a9c3e3; --clinic: #3a271b; --clinic-ink: #f0b48a; --clinician: #253017; --clinician-ink: #c6e57a;
  --paper: #fbfbfa; --paper-ink: #1f1f1e; --paper-line: #e3e2de;
  --nav-bg: #0d111a; --nav-ink: #a3acc0; --nav-on: #ffffff; --nav-hi: #1c2232; --shadow: 0 1px 2px rgba(0,0,0,0.4); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #11151f; --surface: #181e2b; --surface-2: #1d2433; --band: #1a2536; --ink: #e4e9f1; --ink-2: #c3ccd9; --muted: #8f9aac;
  --line: #29313f; --line-2: #36404f; --accent: #8fb0d8; --accent-2: #a9c3e3; --accent-ink: #0e1420; --accent-soft: #1f2a3d;
  --brand: #a8d43a; --brand-2: #bde15c; --brand-soft: #253017; --brand-ink: #c6e57a;
  --ok: #6fd2a2; --ok-soft: #15352a; --warn: #ff8a7e; --warn-soft: #3a1b18; --amber: #f2c46e; --amber-soft: #362a12;
  --info: #8ab4f8; --info-soft: #182a46;
  --device: #1f2a3d; --device-ink: #a9c3e3; --clinic: #3a271b; --clinic-ink: #f0b48a; --clinician: #253017; --clinician-ink: #c6e57a;
  --paper: #fbfbfa; --paper-ink: #1f1f1e; --paper-line: #e3e2de;
  --nav-bg: #0d111a; --nav-ink: #a3acc0; --nav-on: #ffffff; --nav-hi: #1c2232; --shadow: 0 1px 2px rgba(0,0,0,0.4); color-scheme: dark }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--f-ui); }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; font-weight: 700; color: var(--ink); }
h1 { font-size: 20px; } h2 { font-size: 16px; } h3 { font-size: 14px; } h4 { font-size: 13px; }
.mono, .num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); } .small { font-size: 12.5px; } .xs { font-size: 11.5px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---- app chrome ---- */
.appbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; height: 52px; background: var(--surface); border-bottom: 1px solid var(--line); box-shadow: inset 0 -3px 0 var(--brand);
  display: flex; align-items: center; gap: 14px; padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
.logo { display: flex; align-items: center; gap: 8px; font-weight: 700; letter-spacing: 0.01em; text-decoration: none; color: var(--ink); }
.logo .wm { display: grid; line-height: 1; } .logo .wm b { font-size: 18px; font-weight: 800; color: var(--accent); letter-spacing: 0.01em; } .logo .wm small { font-size: 10px; font-weight: 700; color: var(--brand-2); letter-spacing: 0.08em; text-transform: uppercase; margin-top: 2px; }
.logo i { width: 30px; height: 30px; border-radius: 8px; background: var(--nav-bg); color: var(--brand); font-weight: 700; display: grid; place-items: center; font-style: normal; font-size: 12px; font-family: var(--f-mono); }
.clinicpick { border: 1px solid var(--line); background: var(--surface-2); border-radius: 6px; padding: 5px 10px; font-size: 13px; }
.search { flex: 1; max-width: 440px; position: relative; }
.search input { width: 100%; border: 1px solid var(--line); background: var(--surface-2); border-radius: 6px; padding: 7px 10px 7px 30px; font-size: 13px; }
.search::before { content: "⌕"; position: absolute; left: 10px; top: 5px; color: var(--muted); font-size: 16px; }
.appbar .sp { flex: 1; }
.mock { background: var(--warn-soft); color: var(--warn); font-weight: 600; font-size: 11.5px; padding: 3px 8px; border-radius: 4px; letter-spacing: 0.02em; white-space: nowrap; }
.avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-weight: 600; font-size: 12px; }
.iconbtn { border: 0; background: none; width: 32px; height: 32px; border-radius: 6px; color: var(--ink-2); position: relative; }
.iconbtn:hover { background: var(--surface-2); }
.iconbtn .dot { position: absolute; top: 6px; right: 6px; width: 7px; height: 7px; border-radius: 50%; background: var(--warn); }
.frame { display: grid; grid-template-columns: 208px minmax(0, 1fr); min-height: calc(100% - 52px); }
.nav { background: var(--nav-bg); color: var(--nav-ink); padding: 12px 8px; padding-left: max(8px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 2px; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 6px; color: var(--nav-ink); text-decoration: none; font-size: 13.5px; }
.nav a:hover { background: var(--nav-hi); color: var(--nav-on); }
.nav a.on { background: var(--nav-hi); color: var(--nav-on); box-shadow: inset 3px 0 0 var(--brand); }
.nav a .ic { width: 18px; text-align: center; opacity: 0.85; }
.nav a .cnt { margin-left: auto; font-size: 11px; background: var(--brand); color: #1d2738; font-weight: 700; border-radius: 99px; padding: 0 7px; }
.nav .grp { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.1em; opacity: 0.55; padding: 14px 10px 4px; }
.nav .foot { margin-top: auto; font-size: 11px; opacity: 0.6; padding: 10px; line-height: 1.5; }
main#main { min-width: 0; }
.page { padding-block: 20px 60px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); display: grid; gap: 16px; max-width: 1320px; }
.crumbs { font-size: 12.5px; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; }
.crumbs a { color: var(--muted); text-decoration: none; } .crumbs a:hover { color: var(--accent); }
.pagehead { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; }

/* ---- shared components (modules use these) ---- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); min-width: 0; }
.card > .hd { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.card > .bd { padding: 12px 14px; }
.btn { border: 1px solid var(--line-2); background: var(--surface); border-radius: 999px; padding: 6px 14px; font-size: 13px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; text-decoration: none; color: var(--ink); }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { background: var(--accent-2); }
.btn.ghost { border-color: transparent; background: none; }
.btn.danger { color: var(--warn); border-color: var(--warn); }
.btn.sm { padding: 3px 8px; font-size: 12px; }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 5px 10px; font-size: 12.5px; border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--accent); color: var(--accent-ink); }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 500; padding: 2px 8px; border-radius: 99px; background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); white-space: nowrap; }
.chip.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.chip.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.chip.amber { background: var(--amber-soft); color: var(--amber); border-color: transparent; }
.chip.info { background: var(--info-soft); color: var(--info); border-color: transparent; }
.chip.device { background: var(--device); color: var(--device-ink); border-color: transparent; }
.chip.clinic { background: var(--clinic); color: var(--clinic-ink); border-color: transparent; }
.chip.clinician { background: var(--clinician); color: var(--clinician-ink); border-color: transparent; }
.chip .d { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.tbl { border-collapse: collapse; width: 100%; font-size: 13px; }
.tbl th { text-align: left; font-weight: 500; font-size: 11.5px; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--line); background: var(--surface-2); white-space: nowrap; }
.tbl td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl tr.link { cursor: pointer; } .tbl tr.link:hover td { background: var(--accent-soft); }
.tbl td.num, .tbl th.num { text-align: right; }
.scroll-x { overflow-x: auto; }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--surface-2); }
.toolbar .sep { width: 1px; height: 22px; background: var(--line-2); }
.toolbar label { font-size: 12px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
.toolbar select, .field select, .field input, .field textarea { border: 1px solid var(--line-2); background: var(--surface); border-radius: 5px; padding: 4px 8px; font-size: 12.5px; }
.field { display: grid; gap: 4px; } .field > span { font-size: 12px; color: var(--muted); }
.paper { background: var(--paper); color: var(--paper-ink); border: 1px solid var(--paper-line); border-radius: 6px; }
.banner { display: flex; gap: 10px; align-items: flex-start; padding: 9px 12px; border-radius: 0 6px 6px 0; font-size: 13px; background: var(--info-soft); color: var(--ink); border: 1px solid transparent; border-left: 4px solid var(--accent); }
.banner.amber { background: var(--amber-soft); border-left-color: var(--amber); } .banner.warn { background: var(--warn-soft); border-left-color: var(--warn); } .banner.ok { background: var(--brand-soft); border-left-color: var(--brand); }
.banner b { font-weight: 600; }
.sys { margin: 3px 0; } .sys .sid { font-family: var(--f-mono); font-size: 10.5px; color: var(--muted); margin-left: 6px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 5px 14px; font-size: 13px; } .kv dt { color: var(--muted); } .kv dd { margin: 0; }
.grid { display: grid; gap: 16px; } .g2 { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); } .g3 { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.between { justify-content: space-between; }
.empty { padding: 28px; text-align: center; color: var(--muted); }
/* spec annotations: off by default; the "Annotations" switch shows where a feature comes from */
.ann { display: none; font-family: var(--f-mono); font-size: 10.5px; font-weight: 400; color: var(--accent); background: var(--accent-soft); border: 1px dashed var(--accent); border-radius: 4px; padding: 0 5px; margin-left: 6px; vertical-align: 1px; white-space: nowrap; }
body.annotate .ann { display: inline-block; }

/* ---- measurement workspace ---- */
.ws-head { background: var(--surface); border-bottom: 1px solid var(--line); padding: 12px 20px 0; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); display: grid; gap: 10px; }
.ws-id { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; }
.ws-id .who { font-size: 18px; font-weight: 600; }
.ws-id .meta { color: var(--muted); font-size: 13px; display: flex; gap: 14px; flex-wrap: wrap; }
.pipe { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; font-size: 12px; }
.pipe span { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 99px; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.pipe span.done { color: var(--brand-ink); background: var(--brand-soft); border-color: transparent; }
.pipe span.now { color: var(--amber); background: var(--amber-soft); border-color: transparent; font-weight: 600; }
.pipe i { color: var(--line-2); font-style: normal; }
.wtabs { display: flex; gap: 2px; overflow-x: auto; }
.wtabs a { padding: 9px 14px; text-decoration: none; color: var(--muted); border-bottom: 2px solid transparent; font-weight: 500; white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; }
.wtabs a:hover { color: var(--ink); }
.wtabs a.on { color: var(--ink); border-color: var(--brand); }
.wtabs a .chip { font-size: 10.5px; padding: 0 6px; }
.ws-body { padding-block: 16px 60px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); min-width: 0; }

/* ---- hero band: navy with a lime EEG trace, from the company's report cover ---- */
.hero { position: relative; overflow: hidden; background: var(--nav-bg); color: #ffffff; border-radius: 12px; padding: 22px 24px 62px; display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: flex-end; justify-content: space-between; }
.hero h1 { color: #ffffff; font-size: 24px; font-weight: 800; position: relative; }
.hero h1 span { display: block; color: var(--brand); font-weight: 700; font-size: 18px; margin-top: 2px; }
.hero .sub { color: #c3c9dc; font-size: 13px; position: relative; }
.hero svg.trace { position: absolute; left: 0; right: 0; bottom: 6px; width: 100%; height: 46px; opacity: 0.9; pointer-events: none; }
.hero .btn.primary { background: var(--brand); border-color: var(--brand); color: #1d2738; font-weight: 700; position: relative; }
.hero .btn.primary:hover { background: var(--brand-2); }
.twotone { font-weight: 800; } .twotone span { color: var(--brand-2); }
/* ---- toast and dialog ---- */
#toasts { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: max(16px, env(safe-area-inset-bottom, 0px)); display: grid; gap: 8px; z-index: 50; }
.toast { background: var(--ink); color: var(--surface); padding: 9px 14px; border-radius: 6px; font-size: 13px; box-shadow: var(--shadow); max-width: 360px; }
.dlg-back { position: fixed; inset: 0; background: rgba(10,20,28,0.45); display: grid; place-items: center; z-index: 40; padding: 16px; }
.dlg { background: var(--surface); border-radius: 10px; width: min(520px, 100%); box-shadow: 0 10px 40px rgba(0,0,0,0.3); display: grid; }
.dlg .hd { padding: 14px 18px; border-bottom: 1px solid var(--line); } .dlg .bd { padding: 14px 18px; display: grid; gap: 10px; } .dlg .ft { padding: 12px 18px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 8px; }

@media (max-width: 900px) {
  .frame { grid-template-columns: minmax(0, 1fr); }
  .nav { flex-direction: row; flex-wrap: wrap; padding-right: max(8px, env(safe-area-inset-right, 0px)); }
  .nav .grp, .nav .foot { display: none; }
  .search, .clinicpick { display: none; }
}
@media (max-width: 520px) {
  .appbar { gap: 8px; }
  .appbar label[for="annToggle"], .logo .wm small { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<script>
/* =========================================================================================
   Shell: data, state, shared helpers (APP), router, list pages. Modules register in
   window.Modules and render the measurement workspace tabs.
   ========================================================================================= */
const DATA = /*__DATA__*/null;
window.Modules = window.Modules || {};
const APP = window.APP = {
  data: DATA,
  case: DATA.case,
  m1: DATA.case.measurements[0],
  m2: DATA.case.measurements[1],
  sentences: DATA.sentences,
  channels: DATA.case.channels,
  pos: DATA.case.positions,
  bands: DATA.case.bands,
  state: {
    staffView: false,
    segments: { confirmed: false, changes: 0 },
    cleaning: { confirmed: false, changed: [] },      /* [{ic, kind, removed}] filled by the cleaning module */
    markers: { confirmed: false, hz: null },
    report: { status: 'draft', version: 1, issued: [], texts: {} },
    template: { version: 3 },
    measurement: 'm2',
  },
  log: [],
};
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = APP.esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
APP.ann = (t) => `<span class="ann">${esc(t)}</span>`;
APP.sys = (items) => (items || []).map(s => `<p class="sys">${esc(s.text)}<span class="sid">${esc(s.id)}</span></p>`).join('');
APP.fmtDate = (iso) => { const d = new Date(iso + 'T12:00:00'); return `${d.getDate()} ${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()]} ${d.getFullYear()}`; };
APP.time = () => new Date().toTimeString().slice(0, 5);
APP.addLog = (actor, text) => { APP.log.unshift({ t: 'Today ' + APP.time(), actor, text }); };

/* fixed device colour scale, identical to the PDF report: blue below, grey at the mean, red above, clipped at z = +-3 */
const ZC = [[16,66,129],[42,120,214],[158,197,244],[240,239,236],[244,178,168],[227,73,72],[154,31,30]];
APP.zRGB = (z) => { const t = Math.max(0, Math.min(1, ((+z || 0) + 3) / 6)) * (ZC.length - 1), i = Math.min(ZC.length - 2, Math.floor(t)), f = t - i;
  return ZC[i].map((v, k) => Math.round(v + (ZC[i + 1][k] - v) * f)); };
APP.zColor = (z) => `rgb(${APP.zRGB(z)})`;
APP.zInk = (z) => Math.abs(z) >= 2.4 ? '#ffffff' : '#1f1f1e';

/* topographic map on a canvas: values per channel in APP.channels order (z values by default).
   opts: { size, title, names, marks: [channel], highlight: channel, lim } -> returns hit test fn(x, y) -> channel */
APP.topo = (canvas, values, opts = {}) => {
  const S = opts.size || 140, dpr = window.devicePixelRatio || 1, pad = opts.title ? 16 : 4, H = S + pad;
  canvas.width = S * dpr; canvas.height = H * dpr; canvas.style.width = S + 'px'; canvas.style.height = H + 'px';
  const g = canvas.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, S, H);
  const cx = S / 2, cy = pad + S / 2 - 2, R = S / 2 - 10, lim = opts.lim || 3;
  const P = APP.channels.map(c => APP.pos[c]);
  const step = Math.max(1, Math.round(2 / dpr * (S / 140)));
  const img = g.createImageData(Math.ceil(2 * R * dpr), Math.ceil(2 * R * dpr));
  const W = img.width;
  for (let py = 0; py < W; py++) for (let px = 0; px < W; px++) {
    const x = (px / dpr - R) / R * 1.08, y = -(py / dpr - R) / R * 1.08;
    if (x * x + y * y > 1.08 * 1.08) continue;
    let num = 0, den = 0;
    for (let k = 0; k < P.length; k++) { const d = (P[k][0] - x) ** 2 + (P[k][1] - y) ** 2 + 0.004; const w = 1 / (d * d); num += values[k] * w; den += w; }
    const c = APP.zRGB(num / den * 3 / lim), o = (py * W + px) * 4;
    img.data[o] = c[0]; img.data[o + 1] = c[1]; img.data[o + 2] = c[2]; img.data[o + 3] = 255;
  }
  g.putImageData(img, Math.round((cx - R) * dpr), Math.round((cy - R) * dpr));
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.strokeStyle = '#2b2b2b'; g.lineWidth = 1.1;
  g.beginPath(); g.arc(cx, cy, R, 0, 2 * Math.PI); g.stroke();
  g.beginPath(); g.moveTo(cx - 7, cy - R + 1); g.lineTo(cx, cy - R - 8); g.lineTo(cx + 7, cy - R + 1); g.stroke();
  for (const s of [-1, 1]) { g.beginPath(); g.ellipse(cx + s * (R + 3), cy, 3, 9, 0, 0, 2 * Math.PI); g.stroke(); }
  const pt = (c) => [cx + APP.pos[c][0] * R / 1.08, cy - APP.pos[c][1] * R / 1.08];
  APP.channels.forEach(c => { const [x, y] = pt(c); g.fillStyle = '#2b2b2b'; g.beginPath(); g.arc(x, y, opts.highlight === c ? 3.4 : 1.6, 0, 2 * Math.PI); g.fill();
    if (opts.names) { g.font = '9px IBM Plex Mono, monospace'; g.fillText(c, x - 7, y - 4); } });
  (opts.marks || []).forEach(c => { const [x, y] = pt(c); g.strokeStyle = '#111'; g.lineWidth = 1.2; g.beginPath(); g.arc(x, y, 6, 0, 2 * Math.PI); g.stroke(); });
  if (opts.title) { g.fillStyle = '#1f1f1e'; g.font = '600 11px IBM Plex Sans, sans-serif'; g.textAlign = 'center'; g.fillText(opts.title, cx, 11); g.textAlign = 'left'; }
  return (x, y) => { let best = null, bd = 1e9; APP.channels.forEach(c => { const [px, py] = pt(c); const d = (px - x) ** 2 + (py - y) ** 2; if (d < bd) { bd = d; best = c; } }); return bd < 140 ? best : null; };
};

/* a deterministic EEG-like trace for the hero band */
APP.trace = (w = 1200, h = 46, seed = 7) => {
  let r = seed >>> 0; const rnd = () => (r = (r * 1664525 + 1013904223) >>> 0) / 4294967296;
  const pts = []; let v = 0;
  for (let x = 0; x <= w; x += 3) { v = 0.6 * v + (rnd() - 0.5) * 8; const a = Math.sin(x / 7) * 7 * (0.5 + 0.5 * Math.sin(x / 90)); pts.push([x, h / 2 + v + a]); }
  return `<svg class="trace" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><path d="M${pts.map(p => p[0] + ' ' + p[1].toFixed(1)).join(' L')}" fill="none" stroke="#96c11f" stroke-width="1.4" vector-effect="non-scaling-stroke" opacity="0.85"/></svg>`;
};

    <div class="banner ${st === 'issued' ? 'ok' : 'amber'}"><b>Next step</b><span style="flex:1">${next[0]}.</span><a class="btn sm primary" href="#${next[1]}">Open</a></div>
    <div class="grid g2">
      <div class="card"><div class="hd"><h2>Recording</h2><span class="chip ok">Quality sufficient</span></div><div class="bd">
        <div class="scroll-x"><table class="tbl"><tr><th>Condition</th><th class="num">Recorded</th><th class="num">Analysed</th></tr>
        ${Object.entries(q.recordings).map(([k, v]) => `<tr><td>${{ EO: 'Eyes open', EC: 'Eyes closed', VCPT: 'VCPT' }[k]}</td><td class="num">${v.recorded_s} s</td><td class="num">${v.analysed_s} s</td></tr>`).join('')}</table></div>
        <p class="small muted" style="margin-bottom:0">VCPT accepted trials: Go ${q.accepted_trials.go} · NoGo ${q.accepted_trials.nogo} · Ignore ${q.accepted_trials.ignore} · Novelty ${q.accepted_trials.novelty} of 100 each</p></div></div>
      <div class="card"><div class="hd"><h2>Processing</h2>${APP.ann('3.8 Speed, Reproducibility')}</div><div class="bd"><dl class="kv">
        <dt>Software</dt><dd>${esc(APP.m2.processed_with.software)}</dd><dt>Norms</dt><dd>${esc(APP.m2.processed_with.norms)}</dd><dt>Duration</dt><dd>6 min 40 s (automatic)</dd>
        <dt>Reference</dt><dd>Average of 19 channels · notch 50 Hz</dd><dt>Segments</dt><dd>${s.segments.confirmed ? 'Confirmed by Clinician 1' : 'Proposed, waiting for review'}</dd>
        <dt>Cleaning</dt><dd>${s.cleaning.confirmed ? (s.cleaning.changed.length ? 'Changed manually' : 'Accepted as proposed') : 'Proposed, waiting for review'}</dd></dl></div></div>
    </div>
    <div class="card"><div class="hd"><h2>Summary of results</h2><a class="small" href="#results">Open results</a></div><div class="bd">${APP.sys(APP.sentences.m2.summary)}</div></div>
  </div>`;
}

/* ---------------- router ---------------- */
const WS = new Set(['overview', 'segments', 'cleaning', 'results', 'report', 'issued']);
let current = null;
function render() {
  const r = location.hash.slice(1) || 'worklist';
  const route = (PAGES[r] !== undefined || WS.has(r) || r === 'templates') ? r : 'worklist';
  if (current && current.destroy) { try { current.destroy(); } catch (e) {} }
  current = null;
  $$('#nav a').forEach(a => a.classList.toggle('on', a.dataset.r === route || (a.dataset.r === 'patients' && (WS.has(route) || route === 'patient' || route === 'compare'))));
  $('#cntWork').textContent = stage() === 'issued' ? 3 : 4;
  const main = $('#main');
  if (WS.has(route)) {
    main.innerHTML = workspace(route);
    const root = $('#modRoot');
    if (route === 'overview') overview(root);
    else mount(route, root);
  } else if (route === 'templates') {
    main.innerHTML = '<div class="page" id="modRoot"></div>'; mount('template', $('#modRoot'));
  } else {
    main.innerHTML = PAGES[route]();
    if (route === 'compare') mount('compare', $('#modRoot'));
  }
  wire(route);
}
function mount(name, root) {
  const M = window.Modules[name];
  if (!M) { root.innerHTML = `<div class="card"><div class="empty"><b>Not in this version of the mockup yet.</b><br>This screen comes next.</div></div>`; return; }
  try { current = M; M.render(root, { route: name }); }
  catch (e) { console.error(e); root.innerHTML = `<div class="banner warn"><b>Module error</b>${esc(e.message)}</div>`; }
}
function wire(route) {
  $$('[data-go]').forEach(el => el.onclick = () => APP.go(el.dataset.go));
  const staff = $('#staff'); if (staff) staff.onchange = e => { APP.state.staffView = e.target.checked; APP.addLog(e.target.checked ? 'Company support' : 'Clinician 1', e.target.checked ? 'Opened patient list with time-limited support access (names hidden)' : 'Left support view'); render(); };
  const grant = $('#grant'); if (grant) grant.onclick = () => { APP.addLog('Clinic admin', 'Granted support access for 48 hours'); APP.toast('Support access granted until 31 Oct, 18:00'); };
  if (route === 'upload') {
    const start = () => { $('#dropz').hidden = true; $('#upProg').hidden = false; let p = 0; const steps = ['Read file', 'Filter and re-reference', 'Propose segments', 'ICA cleaning proposal', 'Spectra and maps', 'Coherence and asymmetry', 'Channel ERPs', 'VCPT behaviour', 'Compare with norms'];
      const t = setInterval(() => { if (!$('#upBar')) { clearInterval(t); return; } p += 4; $('#upBar').style.width = Math.min(100, p) + '%'; $('#upPct').textContent = Math.min(100, p) + '%'; $('#upSteps').textContent = p < 30 ? 'Uploading…' : 'Processing: ' + steps[Math.min(8, Math.floor((p - 30) / 8))];
        if (p >= 100) { clearInterval(t); $('#upSteps').innerHTML = 'Done in 6 min 40 s (shortened for the mockup). <a href="#overview">Open measurement</a>'; APP.addLog('System', 'Processed a new recording for MOCK-042 (demo)'); } }, 90); };
    $('#pickf').onclick = start; const dz = $('#dropz'); dz.ondragover = e => e.preventDefault(); dz.ondrop = e => { e.preventDefault(); start(); };
  }
}
$('#annToggle').onchange = e => document.body.classList.toggle('annotate', e.target.checked);
$('#bell').onclick = () => APP.toast('MOCK-031 finished processing · MOCK-017 is waiting for segment review');
$('#gsearch').onkeydown = e => { if (e.key === 'Enter') APP.go('patients'); };
window.addEventListener('hashchange', render);
APP.addLog('Clinician 1', 'Uploaded the recording of 15 Sep 2026 for MOCK-042');
APP.addLog('System', 'Processed MOCK-042 / 15 Sep 2026 in 6 min 40 s with V4 mockup 0.1 and Mock norms 2026.1');
APP.addLog('System', 'Reprocessed MOCK-042 / 12 Mar 2026 with the current software and norms for comparison');
document.addEventListener('DOMContentLoaded', render);
/*__MODULES__*/
if (document.readyState !== 'loading') render();
</script>
