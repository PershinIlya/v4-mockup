<title>V4 Clinic Workspace</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a clinical web application. Fixed app bar, a narrow navigation rail, and a work area
   that holds either a list page or a measurement workspace with its own tab bar and side panels.
   Device figures (maps, curves) always draw on a light "paper" surface with the fixed z scale. */
/* Company design continuity: the company's navy and lime (web site and company report templates), lifted to a
   modern product: navy carries the chrome and primary actions, lime marks brand and selection,
   pale lime is the soft highlight. Semantic colours stay separate from the brand lime. */
/* Tokens (review C25, C26): one navy for the chrome and the primary actions (--navy, --accent); lime
   only for the brand and the current selection; one success colour (--ok) for done, issued and
   accepted; the clinician chip in violet, away from the brand lime; --link for text links; status
   reds (--warn: rejected, no norm) are crimson with an icon, apart from the red of the z scale. */
:root {
  --bg: #f1f5fa; --surface: #ffffff; --surface-2: #f6f9fc; --band: #e3eef8; --ink: #1d2738; --ink-2: #3d4a5c; --muted: #5d6a7c;
  --line: #dfe4eb; --line-2: #87929f; --navy: #2a2e47; --accent: #2a2e47; --accent-2: #1b1e31; --accent-ink: #ffffff; --accent-soft: #e9ebf3;
  --brand: #96c11f; --brand-2: #7fa616; --brand-soft: #f0f8dc; --brand-ink: #4b6a00;
  --ok: #1f7a55; --ok-soft: #e1f2ea; --warn: #a3184f; --warn-soft: #fae6ee; --amber: #8f5b00; --amber-soft: #fcf0d6;
  --info: #0b6b6f; --info-soft: #dcf0ef; --link: #2c4fa3; --focus: #2a2e47; --focus-on-navy: #96c11f;
  --device: #e8edf4; --device-ink: #2a3d57; --clinic: #fbeee4; --clinic-ink: #8a3d12; --clinician: #f1ecfb; --clinician-ink: #5a3d9a;
  --paper: #ffffff; --paper-ink: #1f1f1e; --paper-line: #e3e2de;
  --nav-bg: #2a2e47; --nav-ink: #c3c9dc; --nav-on: #ffffff; --nav-hi: #363b5a;
  --shadow: 0 1px 2px rgba(30,40,70,0.06), 0 2px 10px rgba(30,40,70,0.06);
  --f-ui: 'Nunito Sans', 'Segoe UI', system-ui, sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
  --r: 8px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11151f; --surface: #181e2b; --surface-2: #1d2433; --band: #1a2536; --ink: #e4e9f1; --ink-2: #c3ccd9; --muted: #8f9aac;
  --line: #29313f; --line-2: #5a6578; --navy: #1f2440; --accent: #8fb0d8; --accent-2: #a9c3e3; --accent-ink: #0e1420; --accent-soft: #1f2a3d;
  --brand: #a8d43a; --brand-2: #bde15c; --brand-soft: #253017; --brand-ink: #c6e57a;
  --ok: #6fd2a2; --ok-soft: #15352a; --warn: #ff8fb8; --warn-soft: #3a1727; --amber: #f2c46e; --amber-soft: #362a12;
  --info: #63d0c8; --info-soft: #12302f; --link: #9fb8f0; --focus: #a9c3e3; --focus-on-navy: #a8d43a;
  --device: #1f2a3d; --device-ink: #a9c3e3; --clinic: #3a271b; --clinic-ink: #f0b48a; --clinician: #2b2342; --clinician-ink: #cdb8f7;
  --paper: #fbfbfa; --paper-ink: #1f1f1e; --paper-line: #e3e2de;
  --nav-bg: #1f2440; --nav-ink: #b3bbd0; --nav-on: #ffffff; --nav-hi: #2c3256; --shadow: 0 1px 2px rgba(0,0,0,0.4); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #11151f; --surface: #181e2b; --surface-2: #1d2433; --band: #1a2536; --ink: #e4e9f1; --ink-2: #c3ccd9; --muted: #8f9aac;
  --line: #29313f; --line-2: #5a6578; --navy: #1f2440; --accent: #8fb0d8; --accent-2: #a9c3e3; --accent-ink: #0e1420; --accent-soft: #1f2a3d;
  --brand: #a8d43a; --brand-2: #bde15c; --brand-soft: #253017; --brand-ink: #c6e57a;
  --ok: #6fd2a2; --ok-soft: #15352a; --warn: #ff8fb8; --warn-soft: #3a1727; --amber: #f2c46e; --amber-soft: #362a12;
  --info: #63d0c8; --info-soft: #12302f; --link: #9fb8f0; --focus: #a9c3e3; --focus-on-navy: #a8d43a;
  --device: #1f2a3d; --device-ink: #a9c3e3; --clinic: #3a271b; --clinic-ink: #f0b48a; --clinician: #2b2342; --clinician-ink: #cdb8f7;
  --paper: #fbfbfa; --paper-ink: #1f1f1e; --paper-line: #e3e2de;
  --nav-bg: #1f2440; --nav-ink: #b3bbd0; --nav-on: #ffffff; --nav-hi: #2c3256; --shadow: 0 1px 2px rgba(0,0,0,0.4); color-scheme: dark }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--f-ui); }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.nav :focus-visible, .hero :focus-visible, .roband :focus-visible { outline-color: var(--focus-on-navy); }
a { color: var(--link); } a:hover { text-decoration-thickness: 2px; }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; font-weight: 700; color: var(--ink); }
h1 { font-size: 20px; } h2 { font-size: 16px; } h3 { font-size: 14px; } h4 { font-size: 13px; }
/* mono only for ids and codes; numbers in tables use tabular figures of the interface font */
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; } .num { font-variant-numeric: tabular-nums; }
.skip { position: absolute; left: 8px; top: -60px; z-index: 60; background: var(--surface); color: var(--ink); border: 2px solid var(--focus); border-radius: 6px; padding: 6px 12px; font-weight: 700; text-decoration: none; }
.skip:focus { top: 8px; }
.muted { color: var(--muted); } .small { font-size: 12.5px; } .xs { font-size: 11.5px; }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---- app chrome ---- */
.appbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; height: 52px; background: var(--surface); border-bottom: 1px solid var(--line); box-shadow: inset 0 -3px 0 var(--brand);
  display: flex; align-items: center; gap: 14px; padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
.logo { display: flex; align-items: center; gap: 8px; font-weight: 700; letter-spacing: 0.01em; text-decoration: none; color: var(--ink); }
.logo .wm { display: grid; line-height: 1; } .logo .wm b { font-size: 18px; font-weight: 800; color: var(--accent); letter-spacing: 0.01em; } .logo .wm small { font-size: 11px; font-weight: 700; color: var(--brand-ink); letter-spacing: 0.08em; text-transform: uppercase; margin-top: 2px; }
.logo i { width: 30px; height: 30px; border-radius: 8px; background: var(--nav-bg); color: var(--brand); font-weight: 700; display: grid; place-items: center; font-style: normal; font-size: 12px; font-family: var(--f-mono); }
.clinicpick { border: 1px solid var(--line); background: var(--surface-2); border-radius: 6px; padding: 5px 10px; font-size: 13px; }
.search { flex: 1; max-width: 440px; position: relative; }
.search input { width: 100%; border: 1px solid var(--line); background: var(--surface-2); border-radius: 6px; padding: 7px 10px 7px 30px; font-size: 13px; }
.search::before { content: "⌕"; position: absolute; left: 10px; top: 5px; color: var(--muted); font-size: 16px; }
.appbar .sp { flex: 1; }
.mock { background: var(--warn-soft); color: var(--warn); font-weight: 600; font-size: 11.5px; padding: 3px 8px; border-radius: 4px; letter-spacing: 0.02em; white-space: nowrap; }
.avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-weight: 600; font-size: 12px; }
.iconbtn { border: 0; background: none; width: 32px; height: 32px; border-radius: 6px; color: var(--ink-2); position: relative; }
.iconbtn:hover { background: var(--surface-2); }
.iconbtn .dot { position: absolute; top: 6px; right: 6px; width: 7px; height: 7px; border-radius: 50%; background: var(--warn); }
.frame { display: grid; grid-template-columns: 208px minmax(0, 1fr); min-height: calc(100% - 52px); }
.nav { background: var(--nav-bg); color: var(--nav-ink); padding: 12px 8px; padding-left: max(8px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 2px; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 6px; color: var(--nav-ink); text-decoration: none; font-size: 13.5px; }
.nav a:hover { background: var(--nav-hi); color: var(--nav-on); }
.nav a.on { background: var(--nav-hi); color: var(--nav-on); box-shadow: inset 3px 0 0 var(--brand); }
.nav a .ic { width: 18px; text-align: center; opacity: 0.85; }
.nav a .cnt { margin-left: auto; font-size: 11px; background: var(--brand); color: #1d2738; font-weight: 700; border-radius: 99px; padding: 0 7px; }
.nav .grp { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; opacity: 0.55; padding: 14px 10px 4px; }
.nav .foot { margin-top: auto; font-size: 11px; opacity: 0.75; padding: 10px; line-height: 1.5; }
.navbtn { display: none; }
/* support and assistant views: a thin band under the app bar names the account and its limits (A2) */
.roband { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 52px); z-index: 19; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; padding: 4px max(14px, env(safe-area-inset-left, 0px)); background: var(--amber-soft); color: var(--amber); border-bottom: 1px solid color-mix(in srgb, var(--amber) 35%, transparent); font-size: 12.5px; font-weight: 600; }
.roband span { font-weight: 400; color: var(--ink-2); }
main#main { min-width: 0; }
.page { padding-block: 20px 60px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); display: grid; gap: 16px; max-width: 1320px; }
.crumbs { font-size: 12.5px; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; }
.crumbs a { color: var(--muted); text-decoration: none; } .crumbs a:hover { color: var(--accent); }
.pagehead { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; }

/* ---- shared components (modules use these) ---- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); min-width: 0; }
.card > .hd { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.card > .bd { padding: 12px 14px; }
.btn { border: 1px solid var(--line-2); background: var(--surface); border-radius: 999px; padding: 6px 14px; font-size: 13px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; text-decoration: none; color: var(--ink); }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { background: var(--accent-2); }
.btn.ghost { border-color: transparent; background: none; }
.btn.danger { color: var(--warn); border-color: var(--warn); }
.btn.sm { padding: 3px 8px; font-size: 12px; }
.btn[disabled], .btn.disabled { opacity: 0.45; cursor: not-allowed; }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 5px 10px; font-size: 12.5px; border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--accent); color: var(--accent-ink); }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 500; padding: 2px 8px; border-radius: 99px; background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); white-space: normal; overflow-wrap: break-word; max-width: 100%; line-height: 1.35; text-align: left; }
.tbl th .chip { white-space: nowrap; }
.chip.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.chip.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.chip.amber { background: var(--amber-soft); color: var(--amber); border-color: transparent; }
.chip.info { background: var(--info-soft); color: var(--info); border-color: transparent; }
.chip.device { background: var(--device); color: var(--device-ink); border-color: transparent; }
.chip.clinic { background: var(--clinic); color: var(--clinic-ink); border-color: transparent; }
.chip.clinician { background: var(--clinician); color: var(--clinician-ink); border-color: transparent; }
.chip .d { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }
/* a clinician task that is still open (review A4): outline chip with a clock; never the spec status wording */
.chip.todo { background: none; color: var(--amber); border: 1px solid currentColor; }
.chip.todo::before { content: "◷"; font-size: 11px; line-height: 1; }
.chip .ico { font-style: normal; font-weight: 700; line-height: 1; }
.tbl { border-collapse: collapse; width: 100%; font-size: 13px; }
.tbl th { text-align: left; font-weight: 500; font-size: 11.5px; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--line); background: var(--surface-2); white-space: nowrap; }
.tbl td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl tr.link { cursor: pointer; } .tbl tr.link:hover td { background: var(--accent-soft); }
.tbl a.rowlink { color: var(--ink); text-decoration: none; font-weight: 700; } .tbl a.rowlink:hover { text-decoration: underline; }
.tbl tr.grp td { background: var(--surface-2); font-size: 12px; font-weight: 700; color: var(--ink-2); padding-block: 6px; }
.tbl tr.dim td { color: var(--muted); }
.tbl td.num, .tbl th.num { text-align: right; }
.up-sys td, .up-sys th { padding: 6px 8px; font-size: 12.5px; } .up-sys tr.on td { background: var(--accent-soft); }
.scroll-x { overflow-x: auto; }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--surface-2); }
.toolbar .sep { width: 1px; height: 22px; background: var(--line-2); }
.toolbar label { font-size: 12px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
.toolbar select, .field select, .field input, .field textarea { border: 1px solid var(--line-2); background: var(--surface); border-radius: 5px; padding: 4px 8px; font-size: 12.5px; }
.field { display: grid; gap: 4px; min-width: 0; } .field select, .field input { max-width: 100%; min-width: 0; } .field > span { font-size: 12px; color: var(--muted); }
.paper { background: var(--paper); color: var(--paper-ink); border: 1px solid var(--paper-line); border-radius: 6px; }
.banner { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: flex-start; padding: 9px 12px; border-radius: 0 6px 6px 0; font-size: 13px; background: var(--info-soft); color: var(--ink); border: 1px solid transparent; border-left: 4px solid var(--accent); }
.banner > span:not(.chip):not(.ann) { flex: 1 1 220px; min-width: 0; }
.banner.amber { background: var(--amber-soft); border-left-color: var(--amber); } .banner.warn { background: var(--warn-soft); border-left-color: var(--warn); } .banner.ok { background: var(--ok-soft); border-left-color: var(--ok); }
.banner b { font-weight: 600; }
.sys { margin: 3px 0; } .sys .sid { font-family: var(--f-mono); font-size: 11px; color: var(--muted); margin-left: 6px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 5px 14px; font-size: 13px; } .kv dt { color: var(--muted); } .kv dd { margin: 0; }
.grid { display: grid; gap: 16px; } .g2 { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); } .g3 { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.between { justify-content: space-between; }
.empty { padding: 28px; text-align: center; color: var(--muted); }
/* spec annotations: off by default; the "Annotations" switch shows where a feature comes from */
.ann { display: none; font-family: var(--f-mono); font-size: 11px; font-weight: 400; color: var(--accent); background: var(--accent-soft); border: 1px dashed var(--accent); border-radius: 4px; padding: 0 5px; margin-left: 6px; vertical-align: 1px; white-space: normal; max-width: min(100%, 560px); overflow-wrap: anywhere; text-align: left; }
body.annotate .ann { display: inline-block; }

/* ---- measurement workspace ---- */
.ws-head { background: var(--surface); border-bottom: 1px solid var(--line); padding: 12px 20px 0; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); display: grid; gap: 10px; }
.ws-id { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; }
.ws-id .who { font-size: 18px; font-weight: 600; }
.ws-id .meta { color: var(--muted); font-size: 13px; display: flex; gap: 14px; flex-wrap: wrap; }
.ws-note { margin: 0; flex-wrap: wrap; } .ws-note > span { min-width: 200px; }
/* the tabs are the stepper (review C5): a tick when a step is confirmed, an outline chip for open tasks */
.wtabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: thin; position: relative; }
.wtabs.fade-r { -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 36px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 36px), transparent); }
.wtabs a { padding: 9px 14px; text-decoration: none; color: var(--muted); border-bottom: 2px solid transparent; font-weight: 600; white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; }
.wtabs a:hover { color: var(--ink); }
.wtabs a.on { color: var(--ink); border-color: var(--brand); }
.wtabs a .tick { color: var(--ok); font-weight: 800; }
.wtabs a .chip { font-size: 11px; padding: 0 6px; white-space: nowrap; }
.wtabs a .n { font-size: 11px; color: var(--muted); font-weight: 600; }
.ws-body { padding-block: 16px 60px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); min-width: 0; }

/* ---- hero band: navy with a lime EEG trace, from the company's report cover ---- */
.hero { position: relative; overflow: hidden; background: var(--nav-bg); color: #ffffff; border-radius: 12px; padding: 22px 24px 62px; display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: flex-end; justify-content: space-between; }
.hero h1 { color: #ffffff; font-size: 24px; font-weight: 800; position: relative; }
.hero h1 span { display: block; color: var(--brand); font-weight: 700; font-size: 18px; margin-top: 2px; }
.hero .sub { color: #c3c9dc; font-size: 13px; position: relative; }
.hero svg.trace { position: absolute; left: 0; right: 0; bottom: 6px; width: 100%; height: 46px; opacity: 0.9; pointer-events: none; }
.hero .btn.primary { background: var(--brand); border-color: var(--brand); color: #1d2738; font-weight: 700; position: relative; }
.hero .btn.primary:hover { background: var(--brand-2); }
.twotone { font-weight: 800; } .twotone span { color: var(--brand-2); }
/* ---- support access: read only, free text hidden; the assistant view (open question) is read only
   on the measurement steps but sees the clinic's free text ---- */
body.ro.hidefree #modRoot textarea, body.ro.hidefree #modRoot [contenteditable] { filter: blur(4px); pointer-events: none; user-select: none; }
body.ro #modRoot textarea, body.ro #modRoot [contenteditable] { pointer-events: none; }
body.ro #modRoot input:not([data-nav]), body.ro #modRoot select:not([data-nav]) { pointer-events: none; opacity: 0.6; }
/* ---- toast and dialog ---- */
#toasts { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: max(16px, env(safe-area-inset-bottom, 0px)); display: grid; gap: 8px; z-index: 50; }
.toast { background: var(--ink); color: var(--surface); padding: 9px 14px; border-radius: 6px; font-size: 13px; box-shadow: var(--shadow); max-width: 360px; }
.dlg-back { position: fixed; inset: 0; background: rgba(10,20,28,0.45); display: grid; place-items: center; z-index: 40; padding: 16px; }
.dlg { background: var(--surface); border-radius: 10px; width: min(520px, 100%); box-shadow: 0 10px 40px rgba(0,0,0,0.3); display: grid; }
.dlg .hd { padding: 14px 18px; border-bottom: 1px solid var(--line); } .dlg .bd { padding: 14px 18px; display: grid; gap: 10px; } .dlg .ft { padding: 12px 18px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 8px; }

@media (max-width: 900px) {
  .frame { grid-template-columns: minmax(0, 1fr); }
  .nav { flex-direction: row; flex-wrap: wrap; padding-right: max(8px, env(safe-area-inset-right, 0px)); }
  .nav .grp, .nav .foot { display: none; }
  .search, .clinicpick { display: none; }
}
/* phone width (review C27): the navigation opens from a menu button; list rows become cards */
@media (max-width: 720px) {
  .navbtn { display: grid; place-items: center; border: 1px solid var(--line-2); background: var(--surface); border-radius: 6px; width: 34px; height: 32px; font-size: 16px; flex: none; }
  .nav { display: none; }

<script>
/* =========================================================================================
   Shell: data, state, shared helpers (APP), interface language (APP.i18n, APP.t), router,

   ========================================================================================= */
const DATA = /*__DATA__*/null;
window.Modules = window.Modules || {};
let LANG = 'en'; /* English is the default; a viewer's choice is remembered in this browser only */
try { const l = localStorage.getItem('v4-ui-lang'); if (l === 'en' || l === 'de') LANG = l; } catch (e) {}
/* ---------------- cases ----------------

   extra cases MOCK-057 and MOCK-061 (data.extra_cases, one measurement each). APP.openCase(code) makes one
   of them current: APP.case, APP.m1 (null for a case with one measurement), APP.m2 (the current
   measurement), APP.sentences and APP.state all follow it. APP.state is kept per case; the keys in
   GLOBAL_KEYS (who is signed in, support view, list filters, the clinic template, the first-day demo)
   are shared by every case, so a module may read and write them through any case's APP.state. */

const GLOBAL_KEYS = ['staffView', 'ui', 'role', 'empty', 'template'];
function newState() {
  const st = {
    segments: { confirmed: false, changes: 0 },
    cleaning: { confirmed: false, changed: [] },      /* [{ic, kind, removed}] filled by the cleaning module */
    markers: { confirmed: false, hz: null },
    report: { status: 'draft', version: 1, issued: [], texts: {} },
    rejected: null,   /* {why: i18n key, note, at: {d, tm}} while the recording is rejected */
    reopened: null,   /* {from, items, pk, at}: confirmations reopened by an upstream change */
    measurement: 'm2',
    /* an earlier recording uploaded later (B5, MOCK-042 M0): 'none' until the clinic adds it on the upload
       page, then 'queued', 'processing' (step 1 to 9) and 'done'; only then is M0 in APP.measurements() */
    earlier: { status: 'none', step: 0, at: null },
  };
  GLOBAL_KEYS.forEach(k => Object.defineProperty(st, k, { get: () => G[k], set: (v) => { G[k] = v; }, enumerable: true }));
  return st;
}
/* system sentences per language, same structure in each: APP.sentences.m2.summary follows the
   interface language; APP.sentences.de.m2.summary (or .en) names a language explicitly */
const CASES = {};
function addCase(c, sentences, rids) {
  const m2 = c.measurements[c.current_index ?? 1];
  const m1 = c.measurements.length > 1 && c.measurements[0] !== m2 ? c.measurements[0] : null;
  const sent = {}; Object.keys(sentences || {}).forEach(l => { sent[l] = Object.assign({}, sentences[l], sentences); });
  CASES[c.case_code] = { code: c.case_code, case: c, m1, m2, sent, rids: rids || {}, state: newState() };
}
addCase(DATA.case, DATA.sentences, DATA.report_ids);
Object.keys(DATA.extra_cases || {}).forEach(k => { const x = DATA.extra_cases[k]; addCase(x.case, x.sentences, x.report_ids); });
let CUR = CASES[DATA.case.case_code];
const APP = window.APP = {
  data: DATA,
  code: CUR.code,
  case: CUR.case,
  m1: CUR.m1,
  m2: CUR.m2,
  channels: CUR.case.channels,
  pos: CUR.case.positions,
  bands: CUR.case.bands,
  langs: ['en', 'de'],
  state: CUR.state,
  log: [],
  cases: Object.keys(CASES),   /* codes of the cases with full data */
  caseSeq: 0,                  /* raised on every case switch (modules may compare it to drop caches) */
};
Object.defineProperty(APP, 'lang', { get: () => LANG, enumerable: true });
Object.defineProperty(APP, 'sentences', { get: () => CUR.sent[LANG] || CUR.sent.en, enumerable: true });

const caseHooks = [];
/* APP.onCase(fn): fn(code) runs after every case switch, before the page renders again */
APP.onCase = (fn) => { caseHooks.push(fn); };
/* APP.caseInfo(code) -> {code, case, m1, m2, sent, rids, state} of any modelled case, without switching */
APP.caseInfo = (code) => CASES[code || CUR.code] || null;
/* APP.openCase(code, route?): make a case current (false if it has no data); with route also navigate */
APP.openCase = (code, route) => {
  const c = CASES[code]; if (!c) return false;
  if (c !== CUR) {
    CUR = c; APP.code = c.code; APP.case = c.case; APP.m1 = c.m1; APP.m2 = c.m2; APP.state = c.state;
    APP.channels = c.case.channels; APP.pos = c.case.positions; APP.bands = c.case.bands; APP.caseSeq++;

/* measurement key: 'm2' for the current measurement, else the last part of the id in lower case

const $$ = (s, el = document) => [...el.querySelectorAll(s)];

  if (v.$at) return APP.atZ(v.$at, L);
  if (v.$d) return APP.fmtDate(v.$d, L);

const MON = { en: ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],

  document.body.append(back);
  const close = () => back.remove();
  back.querySelector('[data-x]').onclick = close;
  back.querySelector('[data-ok]').onclick = () => { if (!onOk || onOk(back) !== false) close(); };
  back.addEventListener('click', e => { if (e.target === back) close(); });
  const esc_ = e => { if (e.key === 'Escape') close(); }; document.addEventListener('keydown', esc_);

/* topographic map on a canvas: values per channel in APP.channels order (z values by default).
   opts: { size, title, names, marks: [channel], highlight: channel, lim } -> returns hit test fn(x, y) -> channel */
APP.topo = (canvas, values, opts = {}) => {
  const S = opts.size || 140, dpr = window.devicePixelRatio || 1, pad = opts.title ? 16 : 4, H = S + pad;
  canvas.width = S * dpr; canvas.height = H * dpr; canvas.style.width = S + 'px'; canvas.style.height = H + 'px';
  const g = canvas.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, S, H);
  const cx = S / 2, cy = pad + S / 2 - 2, R = S / 2 - 10, lim = opts.lim || 3;
  const P = APP.channels.map(c => APP.pos[c]);
  const img = g.createImageData(Math.ceil(2 * R * dpr), Math.ceil(2 * R * dpr));
  const W = img.width;
  for (let py = 0; py < W; py++) for (let px = 0; px < W; px++) {
    const x = (px / dpr - R) / R * 1.08, y = -(py / dpr - R) / R * 1.08;
    if (x * x + y * y > 1.08 * 1.08) continue;
    let num = 0, den = 0;
    for (let k = 0; k < P.length; k++) { const d = (P[k][0] - x) ** 2 + (P[k][1] - y) ** 2 + 0.004; const w = 1 / (d * d); num += values[k] * w; den += w; }

  g.putImageData(img, Math.round((cx - R) * dpr), Math.round((cy - R) * dpr));

  g.beginPath(); g.moveTo(cx - 7, cy - R + 1); g.lineTo(cx, cy - R - 8); g.lineTo(cx + 7, cy - R + 1); g.stroke();
  for (const s of [-1, 1]) { g.beginPath(); g.ellipse(cx + s * (R + 3), cy, 3, 9, 0, 0, 2 * Math.PI); g.stroke(); }
  const pt = (c) => [cx + APP.pos[c][0] * R / 1.08, cy - APP.pos[c][1] * R / 1.08];
  APP.channels.forEach(c => { const [x, y] = pt(c); g.fillStyle = '#2b2b2b'; g.beginPath(); g.arc(x, y, opts.highlight === c ? 3.4 : 1.6, 0, 2 * Math.PI); g.fill();
    if (opts.names) { g.font = '9px IBM Plex Mono, monospace'; g.fillText(c, x - 7, y - 4); } });

  if (opts.title) { g.fillStyle = '#1f1f1e'; g.font = '600 11px IBM Plex Sans, sans-serif'; g.textAlign = 'center'; g.fillText(opts.title, cx, 11); g.textAlign = 'left'; }
  return (x, y) => { let best = null, bd = 1e9; APP.channels.forEach(c => { const [px, py] = pt(c); const d = (px - x) ** 2 + (py - y) ** 2; if (d < bd) { bd = d; best = c; } }); return bd < 140 ? best : null; };
};

/* the cleaning sentence of the eyes open recording from the fixed library (choice_sentences Q-ICA-AUTO-1,

  let route = (PAGES[r] !== undefined || WS.has(r) || r === 'templates' || MODPAGES.has(r)) ? r : 'worklist';
  if (G.empty && (WS.has(route) || route === 'patient' || route === 'compare')) route = 'patients';
  if (current && current.destroy) { try { current.destroy(); } catch (e) {} }
  current = null; if (ROUTE && ROUTE !== route) { try { window.scrollTo(0, 0); } catch (e) {} } ROUTE = route;
  applyStatic(); roleUI(); roBand();
  document.body.classList.remove('navopen'); const nb = $('#navBtn'); if (nb) nb.setAttribute('aria-expanded', 'false');
  const inCase = WS.has(route) || route === 'patient' || route === 'compare';
  $$('#nav a').forEach(a => { const on = a.dataset.r === route || (a.dataset.r === 'patients' && inCase); a.classList.toggle('on', on); if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  const nr = reviewCount(); $('#cntWork').textContent = nr; $('#cntWork').hidden = !nr;
  const main = $('#main');
  /* read only is a property of the signed-in account: anyone without the review permission (A2) */
  const ro = !APP.can('review') && (WS.has(route) || route === 'templates' || route === 'patient' || route === 'compare');
  document.body.classList.toggle('ro', ro);
  document.body.classList.toggle('hidefree', ro && G.staffView);
  const gate = supportGate(route, inCase) || (inCase && APP.isDeleted() ? APP.stateBox({ tone: 'warn', icon: '✕', title: T('del.stT'), cause: T('del.stC', { at: APP.atZ(G.deleted[CUR.code].at), who: APP.who(G.deleted[CUR.code].by) }), id: 'ST-DEL-1', primary: { label: T('pat.title'), href: '#patients' } }) : '');
  const gate2 = gate || (route === 'activity' && G.role === 'support' ? APP.stateBox({ tone: 'info', icon: '🔒', title: T('gr.logNo'), cause: T('gr.logNoT'), id: 'ST-LOG-1', primary: { label: T('pat.title'), href: '#patients' }, ann: 'Access matrix: company staff do not see the activity log of the clinic (mockup assumption)' }) : '');
  if (gate2) { main.innerHTML = `<div class="page"><div class="card">${gate2}</div></div>`; wire(route); return; }
  if (inCase) logView(route);
  if (WS.has(route)) {
    main.innerHTML = workspace(route);
    const root = $('#modRoot');
    if (route === 'overview') overview(root);
    else mount(route, root);
    tabFade();
  } else if (route === 'templates' || route === 'mapping') {
    main.innerHTML = subtabs(route) + '<div class="page" id="modRoot"></div>'; mount(route === 'templates' ? 'template' : 'mapping', $('#modRoot'));
  } else if (MODPAGES.has(route)) {
    main.innerHTML = '<div class="page" id="modRoot"></div>'; mount(route, $('#modRoot'));
  } else {
    main.innerHTML = PAGES[route]();
    if (route === 'compare') mount('compare', $('#modRoot'));
  }
  wire(route);
}
function mount(name, root) {
  const M = window.Modules[name];
  if (!M) { root.innerHTML = `<div class="card"><div class="empty"><b>${esc(T('mod.none'))}</b><br>${esc(T('mod.next'))}</div></div>`; return; }
  try { current = M; M.render(root, { route: name }); }
  catch (e) { console.error(e); root.innerHTML = `<div class="banner warn"><b>${esc(T('mod.err'))}</b>${esc(e.message)}</div>`; }
}
function wire(route) {

  const ur = $('#wsUnrej'); if (ur) ur.onclick = () => APP.undoReject();
  /* actions of the state component (B8) */
  $$('#main [data-st-act]').forEach(el => el.onclick = () => { const a = el.dataset.stAct;
    if (a === 'undoReject') APP.undoReject();
    else if (a === 'newMeas') { G.ui.upMode = 'new'; G.ui.upPat = CUR.code; APP.go('upload'); }
    else if (a === 'newPatient') { if (APP.newPatient) APP.newPatient(); }
    else if (a === 'roleC1') APP.setRole('c1');
    else if (a === 'settings') APP.go('settings'); });
  /* a link to a step on the Results tab opens that section (APP.state.ui.resSec, read by module B) */
  $$('#main [data-task-sec]').forEach(el => { if (el.dataset.taskSec) el.addEventListener('click', () => { G.ui.resSec = el.dataset.taskSec; }); });
  /* fallback while module B does not read it: open the section once through its rail button, then clear it */
  if (route === 'results' && G.ui.resSec) { const sec = G.ui.resSec; G.ui.resSec = null; const rb = $(`#main [data-sec="${sec}"]`); if (rb && !rb.classList.contains('on')) rb.click(); }

  if (route === 'patient') wirePatient();

  $$('#main [data-newp]').forEach(el => el.onclick = () => { G.ui.upPat = el.dataset.newp; G.ui.upMode = 'new'; APP.go('upload'); });
  $$('#main [data-newpat]').forEach(el => el.onclick = () => { if (APP.newPatient) APP.newPatient(); else APP.toast(T('mod.none')); });
  const ea = $('#main [data-earlier]'); if (ea) ea.onclick = () => { G.ui.upMode = 'earlier'; G.ui.upPat = CUR.code; };
  const un = $('#main [data-upnew]'); if (un) un.onclick = () => { G.ui.upMode = 'new'; G.ui.upPat = CUR.code; };
  $$('[data-wl]').forEach(b => b.onclick = () => { G.ui.wl = b.dataset.wl; render(); });
  const pq = $('#patQ');
  if (pq) { const f = () => { const q = pq.value.trim().toLowerCase(), st = $('#patSt').value, by = $('#patBy').value; let n = 0;
      $$('tr[data-q]').forEach(tr => { const show = (!q || tr.dataset.q.includes(q)) && (!st || tr.dataset.st === st) && (!by || tr.dataset.by === by); tr.hidden = !show; n += show; });
      $('#patCount').textContent = n; };
    pq.oninput = f; $('#patSt').onchange = f; $('#patBy').onchange = f; }
  const staff = $('#staff'); if (staff) staff.onchange = e => APP.setRole(e.target.checked ? 'support' : 'c1');
  /* anamnesis on the patient page */
  const ae = $('#anEdit'); if (ae) ae.onclick = () => { G.ui.anEdit = CUR.code; render(); const t = $('[data-anam]'); if (t) t.focus(); };
  const ac = $('#anCancel'); if (ac) ac.onclick = () => { G.ui.anEdit = null; render(); };
  const as = $('#anSave'); if (as) as.onclick = () => { const A = APP.case.identity_store.anamnesis = APP.case.identity_store.anamnesis || {}; let n = 0;
    $$('[data-anam]').forEach(t => { const k = t.dataset.anam, o = A[k] = A[k] || { en: '', de: '', ja: '' }; if ((o[LANG] ?? '') !== t.value) { o[LANG] = t.value; n++; } });
    G.ui.anEdit = null; if (n) { APP.addLog('who.c1', 'log.anam', { n }); APP.toast(T('toast.anam')); } render(); };
}

document.addEventListener('keydown', e => {

  if (t.matches('input, select, textarea, canvas, [contenteditable], [contenteditable] *') || (t.matches('button') && (e.key === ' ' || e.key === 'Enter'))) {
    e.preventDefault(); e.stopPropagation(); if (e.key.length === 1 || e.key.startsWith('Arrow') || e.key === 'Enter') roMsg(); }
