  --warn: #b3261e; --warn-soft: #fbe9e7; --ok: #1d6b31; --ok-soft: #e4f3e8; --amber: #8a5a00; --amber-soft: #fdf1d8;
  --paper: #ffffff; --paper-ink: #1f1f1e;
  --f-body: 'Public Sans', 'Segoe UI', system-ui, sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {

  --device: #1b2a40; --device-ink: #9cc0f0; --clinic: #3a271b; --clinic-ink: #f0b48a;
  --clinician: #1b3324; --clinician-ink: #8fd6a2; --later: #262826; --later-ink: #a3a39d;
  --warn: #ff8a7e; --warn-soft: #3d1d1a; --ok: #8fd6a2; --ok-soft: #1b3324; --amber: #f1c26b; --amber-soft: #3a2e14;
  --paper: #fbfbfa; --paper-ink: #1f1f1e; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #121716; --panel: #1a2120; --ink: #e3ebe8; --muted: #9aa8a3; --line: #2f3a37;

<script>
const A = /*__ASSETS__*/null;
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const spec = (t) => `<span class="spec">${esc(t)}</span>`;
const sys = (items) => items.map(s => `<p class="sys">${esc(s.text)}<span class="sid">${esc(s.id)}</span></p>`).join('');
const fmtDate = (iso) => new Date(iso + 'T12:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });

/* ---------------- state ---------------- */
const S = {
  view: 'cases', staffView: false,
  uploaded: true, processed: true, consent: { norms: true, research: false, training: false },
  epochs: null, segConfirmed: false,
  ics: null, icConfirmed: false, qualityAccepted: false,
  markers: { suggested: 8.5, value: 8.5, confirmed: false },
  texts: { anamnesis: '', 'comment.spectra': '', 'comment.erp': '', interpretation: '', conclusion: '' },
  comments: { spectra: true, erp: false, vcpt: false },
  versions: [], draft: 1, correcting: false, correctionReason: '',
  tpl: { version: 3, font: 'Liberation Sans', accent: '#1c5cab', intro: 'Thank you for referring {name}. This report summarises the quantitative EEG and ERP recording of {recording_date}.',
         blocks: ['versions', 'summary', 'quality', 'anamnesis', 'spectra', 'comment', 'ratios', 'coherence', 'erp', 'vcpt', 'comparison', 'limits', 'interpretation', 'conclusion'] },
  log: [],
};
function now() { const d = new Date(); return d.toTimeString().slice(0, 5); }
function log(actor, action) { S.log.unshift({ t: '29 Oct ' + now(), actor, action }); }
log('System', 'Recording MOCK-042 / 15 Sep 2026 processed automatically in 6 min 40 s (software V4 mockup 0.1, norms Mock norms 2026.1)');
log('Clinician 1', 'Uploaded recording for MOCK-042 (eyes open, eyes closed, VCPT)');

/* ---------------- seeded random ---------------- */
function rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
function gauss(r) { let u = 0, v = 0; while (!u) u = r(); while (!v) v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }

/* ---------------- electrodes ---------------- */
const CH = ['Fp1','Fp2','F7','F3','Fz','F4','F8','T3','C3','Cz','C4','T4','T5','P3','Pz','P4','T6','O1','O2'];
const POS = { Fp1:[-0.31,0.95],Fp2:[0.31,0.95],F7:[-0.81,0.59],F3:[-0.41,0.54],Fz:[0,0.5],F4:[0.41,0.54],F8:[0.81,0.59],T3:[-1,0],C3:[-0.5,0],Cz:[0,0],C4:[0.5,0],T4:[1,0],T5:[-0.81,-0.59],P3:[-0.41,-0.54],Pz:[0,-0.5],P4:[0.41,-0.54],T6:[0.81,-0.59],O1:[-0.31,-0.95],O2:[0.31,-0.95] };
const near = (ch, cx, cy, w) => { const [x, y] = POS[ch]; return Math.exp(-((x - cx) ** 2 + (y - cy) ** 2) / (2 * w * w)); };

/* ICA components (synthetic): weights per channel and a time course generator */
function makeICs() {
  const r = rng(42);
  const defs = [
    { kind: 'Eye blinks', w: ch => near(ch, 0, 1, 0.35), proposed: true, conf: 0.97, src: 'blink' },
    { kind: 'Horizontal eye movements', w: ch => POS[ch][0] * near(ch, 0, 0.8, 0.6), proposed: true, conf: 0.91, src: 'saccade' },
    { kind: 'Brain: posterior alpha', w: ch => near(ch, 0, -0.85, 0.45), proposed: false, conf: 0.88, src: 'alpha' },
    { kind: 'Brain: frontal theta', w: ch => near(ch, 0, 0.35, 0.5), proposed: false, conf: 0.8, src: 'theta' },
    { kind: 'Brain: central', w: ch => near(ch, -0.4, 0, 0.45) - near(ch, 0.4, 0, 0.45), proposed: false, conf: 0.71, src: 'noise' },
    { kind: 'Muscle, left temporal', w: ch => near(ch, -0.95, 0.1, 0.35), proposed: true, conf: 0.64, src: 'muscle' },
    { kind: 'Electrode noise, T4', w: ch => ch === 'T4' ? 1 : 0.03 * gauss(r), proposed: false, conf: 0.52, src: 'pop' },
  ];
  for (let i = defs.length; i < 19; i++) {
    const cx = gauss(r) * 0.5, cy = gauss(r) * 0.5, s = r() < 0.5 ? -1 : 1;
    defs.push({ kind: 'Brain', w: ch => s * near(ch, cx, cy, 0.4 + r() * 0.0), proposed: false, conf: 0.6 + r() * 0.3, src: 'noise' });
  }
  return defs.map((d, i) => ({ n: i + 1, kind: d.kind, weights: CH.map(d.w), proposed: d.proposed, conf: d.conf, src: d.src, removed: d.proposed }));
}

/* synthetic raw EEG for the segment and cleaning views: 19 channels, fs 64 Hz */
const FS = 64;
function makeRaw(seconds, cond, ics) {
  const r = rng(cond === 'EO' ? 7 : 11), n = seconds * FS;
  const sources = {};
  const blinkAt = cond === 'EO' ? [3.2, 11.5, 19.1, 27.8, 41.2, 52.4, 66.0, 81.3, 95.5, 104.0, 118.7, 131.2, 150.4, 166.9] : [];
  const muscle = [[34, 37.5], [88, 90.5], [141, 143]];
  const pop = [[121.0, 121.4]];
  const mk = () => new Float32Array(n);
  ['blink', 'saccade', 'alpha', 'theta', 'muscle', 'pop', 'noise'].forEach(k => sources[k] = mk());
  for (let i = 0; i < n; i++) {
    const t = i / FS;
    let b = 0; for (const bt of blinkAt) b += 160 * Math.exp(-((t - bt) ** 2) / 0.02);
    sources.blink[i] = b;
    sources.saccade[i] = cond === 'EO' ? 35 * Math.tanh(Math.sin(2 * Math.PI * 0.05 * t) * 3) : 4 * Math.sin(2 * Math.PI * 0.03 * t);
    sources.alpha[i] = (cond === 'EC' ? 30 : 10) * (0.6 + 0.4 * Math.sin(2 * Math.PI * 0.21 * t)) * Math.sin(2 * Math.PI * 8.7 * t);
    sources.theta[i] = 14 * Math.sin(2 * Math.PI * 5.6 * t + Math.sin(t));
    let m = 0; for (const [a, z] of muscle) if (t > a && t < z) m = 45 * gauss(r);
    sources.muscle[i] = m;
    let p = 0; for (const [a, z] of pop) if (t > a && t < z) p = 300 * Math.exp(-(t - a) * 6);
    sources.pop[i] = p;
  }
  const data = CH.map((ch, c) => {
    const x = new Float32Array(n); let prev = 0;
    for (let i = 0; i < n; i++) { prev = 0.7 * prev + 6 * gauss(r); x[i] = prev; }
    return x;
  });
  const keep = (ic) => !ics || !ic.removed;
  (ics || makeICs()).forEach(ic => {
    if (ics && ic.removed) return;
    const src = sources[ic.src]; if (!src || ic.src === 'noise') return;
    CH.forEach((ch, c) => { const w = ic.weights[c]; if (Math.abs(w) < 0.02) return; const d = data[c]; for (let i = 0; i < n; i++) d[i] += w * src[i]; });
  });
  return { data, n, blinkAt, muscle, pop };
}

function drawEEG(canvas, raw, startS, spanS, epochs, opts = {}) {
  const dpr = window.devicePixelRatio || 1, W = canvas.clientWidth || 900, H = opts.h || 440;
  canvas.width = W * dpr; canvas.height = H * dpr; canvas.style.height = H + 'px';
  const g = canvas.getContext('2d'); g.scale(dpr, dpr);
  const css = getComputedStyle(document.documentElement);
  const ink = css.getPropertyValue('--ink').trim(), muted = css.getPropertyValue('--muted').trim(), line = css.getPropertyValue('--line').trim();
  const left = 44, rowH = (H - 24) / CH.length, plotW = W - left - 8;
  g.clearRect(0, 0, W, H);
  if (epochs) {
    epochs.forEach((e, k) => {
      const a = (e.t0 - startS) / spanS, b = (e.t1 - startS) / spanS;
      if (b < 0 || a > 1) return;
      const x0 = left + Math.max(0, a) * plotW, x1 = left + Math.min(1, b) * plotW;
      g.fillStyle = e.use ? 'rgba(29,107,49,0.10)' : 'rgba(179,38,30,0.16)';
      g.fillRect(x0, 0, x1 - x0, H - 22);
      g.strokeStyle = line; g.beginPath(); g.moveTo(x0, 0); g.lineTo(x0, H - 22); g.stroke();
      if (!e.use) { g.fillStyle = 'rgba(179,38,30,0.85)'; g.font = '11px IBM Plex Mono, monospace'; g.fillText(e.why || 'excluded', x0 + 4, 12); }
    });
  }
  g.font = '11px IBM Plex Mono, monospace';
  const i0 = Math.floor(startS * FS), i1 = Math.min(raw.n, Math.floor((startS + spanS) * FS));
  const scale = opts.scale || 0.09;
  CH.forEach((ch, c) => {
    const y0 = 8 + rowH * (c + 0.5);
    g.fillStyle = muted; g.fillText(ch, 4, y0 + 4);
    g.strokeStyle = ink; g.lineWidth = 0.8; g.beginPath();
    for (let i = i0; i < i1; i++) {
      const x = left + ((i / FS - startS) / spanS) * plotW, y = y0 - raw.data[c][i] * scale * rowH / 10;
      i === i0 ? g.moveTo(x, y) : g.lineTo(x, y);
    }
    g.stroke();
  });
  g.fillStyle = muted;
  for (let s = Math.ceil(startS); s <= startS + spanS; s += 2) {
    const x = left + ((s - startS) / spanS) * plotW; g.fillText(s + ' s', x - 8, H - 6);
  }
}

/* fixed device colour scale (same as the report figures) */
const ZC = [[16,66,129],[42,120,214],[158,197,244],[240,239,236],[244,178,168],[227,73,72],[154,31,30]];
function zcol(z) { const t = Math.max(0, Math.min(1, (z + 3) / 6)) * (ZC.length - 1), i = Math.min(ZC.length - 2, Math.floor(t)), f = t - i;
  const c = ZC[i].map((v, k) => Math.round(v + (ZC[i + 1][k] - v) * f)); return `rgb(${c})`; }
function drawTopo(canvas, weights) {
  const s = 64, dpr = window.devicePixelRatio || 1; canvas.width = s * dpr; canvas.height = s * dpr;
  const g = canvas.getContext('2d'); g.scale(dpr, dpr);
  const mx = Math.max(...weights.map(Math.abs)) || 1, R = s / 2 - 4;
  const img = g.createImageData(s * dpr, s * dpr);
  for (let py = 0; py < s * dpr; py++) for (let px = 0; px < s * dpr; px++) {
    const x = (px / dpr - s / 2) / R, y = -(py / dpr - s / 2) / R;
    if (x * x + y * y > 1) continue;
    let num = 0, den = 0; CH.forEach((ch, c) => { const d = (POS[ch][0] - x) ** 2 + (POS[ch][1] - y) ** 2 + 0.01; num += weights[c] / d; den += 1 / d; });
    const col = zcol(3 * num / den / mx).match(/\d+/g).map(Number), k = (py * s * dpr + px) * 4;
    img.data[k] = col[0]; img.data[k + 1] = col[1]; img.data[k + 2] = col[2]; img.data[k + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.strokeStyle = '#2b2b2b'; g.lineWidth = 1; g.beginPath(); g.arc(s / 2, s / 2, R, 0, 2 * Math.PI); g.stroke();
  g.beginPath(); g.moveTo(s / 2 - 4, 4); g.lineTo(s / 2, 0.5); g.lineTo(s / 2 + 4, 4); g.stroke();
}

    const b = $('#startCorr2'); if (!b) return;
    b.onclick = () => { $('#corrBox').innerHTML = `<div class="confirm"><label for="reason" class="small">Reason for the correction</label><input id="reason" style="border:1px solid var(--line);border-radius:6px;padding:6px;background:var(--bg)" placeholder="e.g. typo in the conclusion">
      <button class="btn primary" id="mkCorr">Start version ${S.versions.length + 1}</button></div>`;
      $('#mkCorr').onclick = () => { S.correcting = true; S.draft = S.versions.length + 1; S.correctionReason = $('#reason').value; log('Clinician 1', `Started correction: version ${S.draft} (${S.correctionReason || 'no reason given'})`); go('report'); }; };
  },
  templates: () => {
    $('#intro').oninput = e => { S.tpl.intro = e.target.value; const hits = [...new Set((S.tpl.intro.match(CLAIM) || []).map(s => s.toLowerCase()))];
      $('#claimBox').innerHTML = hits.length ? `<div class="note warn small">Claim wording found: <b>${hits.map(esc).join(', ')}</b>. Clinic texts must not name conditions or mental functions, give treatment advice or state results. This template cannot be saved until the company has reviewed the text. ${spec('I6 open: warn or block')}</div>` : '<div class="note small">No claim words found.</div>';
      $('#saveTpl').disabled = hits.length > 0; };
    document.querySelectorAll('[data-mv]').forEach(b => b.onclick = () => { const i = +b.dataset.mv, j = i + +b.dataset.d, a = S.tpl.blocks; if (j < 0 || j >= a.length) return; [a[i], a[j]] = [a[j], a[i]]; render(); });
    document.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { S.tpl.blocks.splice(+b.dataset.rm, 1); render(); });
    document.querySelectorAll('[data-acc]').forEach(b => b.onclick = () => { S.tpl.accent = b.dataset.acc; render(); });
    $('#font').onchange = e => { S.tpl.font = e.target.value; render(); };
    $('#saveTpl').onclick = () => { S.tpl.version++; log('Clinic admin', `Saved template CT-C-EN as version ${S.tpl.version} (validated against the block schema)`); render(); };
  },
};
function go(v) { location.hash = v; }
function route() { const h = location.hash.slice(1); S.view = V[h] ? h : 'cases'; render(); window.scrollTo(0, 0); }
$('#specToggle').onchange = e => document.body.classList.toggle('nospec', !e.target.checked);
S.ics = makeICs();
window.addEventListener('hashchange', route);
window.addEventListener('resize', () => { if (['segments', 'cleaning'].includes(S.view) || S.tab === 'markers') render(); });
route();
</script>
